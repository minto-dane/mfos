    required_action: "Rename to neutral MFOS-owned terms or add explicit legal/architecture exceptions; extend validator to scan directories."
  - id: NSRT-MAJ-001
    severity: major
    title: Canonical Source Card guidance still contains removed summary-style shape
    evidence:
      - path: docs/design/source-matrix/source-card-schema.md
        lines: "5-7"
        detail: "current schema says cards are not summaries or substitutes"
      - path: docs/design/mfos-design.md
        lines: "288-303"
        detail: "old template includes source_type: normative, title, url, canonical_concepts, list-style mfos_mapping"
      - path: sources/citation-policy.md
        lines: "3-5"
        detail: "still says Source Cards store short summaries"
      - path: docs/design/source-matrix/source-lint-spec.md
        lines: "132,276"
        detail: "source_type guidance conflicts with current public-safe source_type model"
    impact: "Future contributors can reintroduce summary/copy-risk fields despite current card validators passing."
    required_action: "Update stale public guidance and lint specs; add lint coverage for stale Source Card examples outside card YAML."
  - id: NSRT-MAJ-002
    severity: major
    title: Legacy IBM-* IDs remain in non-naming reports outside strict alias contexts
    evidence:
      - path: docs/design/legal-risk-policy.md
        lines: "9-12"
        detail: "legacy IBM-* IDs are said to be retained only in legacy_source_ids and naming migration report"
      - path: reports/requirement-gap-closure.md
        lines: "15-27"
        detail: "old IBM-* IDs appear as source refs in report table"
      - path: reports/source-card-pin-audit.md
        lines: "57-65"
        detail: "old IBM-* IDs appear in pin-review table"
      - path: scripts/check-extref-namespace.py
        lines: "64-83"
        detail: "reports/ is not scanned"
    impact: "Public report bundles can expose obsolete canonical-looking IBM IDs outside the stated alias context."
    required_action: "Migrate release-bound report references to EXTREF-* or archive/exclude historical reports with explicit disclaimer; scan reports in release mode."
  - id: NSRT-MAJ-003
    severity: major
    title: Non-IBM external mark and affiliation controls are incomplete
    evidence:
      - path: NOTICE.md
        lines: "5-19"
        detail: "NOTICE covers IBM marks and IBM non-affiliation, not generic external marks"
      - path: docs/design/source-matrix/cards/MS-VBS-001.yml
        lines: "27-32,72"
        detail: "names Microsoft and URL but trademark_reference_only is false"
      - path: docs/design/source-matrix/cards/X64-INTEL-001.yml
        lines: "29-34,80"
        detail: "names Intel and SDM but trademark_reference_only is false"
      - scan: non_ibm_external_cards_with_mark_controls_false
        result: "13 cards"
    impact: "External-reference legal posture is IBM-specific and does not fully cover other named vendors or projects."
    required_action: "Add generic external-name NOTICE/disclaimer or per-vendor notice policy; align non-IBM Source Card controls with actual mark use."
  - id: NSRT-MAJ-004
    severity: major
    title: Validator coverage is not release-grade
    evidence:
      - path: scripts/check-mf-owned-names.py
        lines: "112"
        detail: "does not scan empty directories"
      - path: scripts/check-extref-namespace.py
        lines: "64-83"
        detail: "does not scan reports/"
      - path: scripts/check-source-card-public-safe.py
        lines: "11-67"
        detail: "checks only card YAML, not stale public guidance"
      - path: schemas/source-card.schema.json
        lines: "28-34"
        detail: "schema allows generic AAA-BBB-001 source_id, including legacy IBM-* shape"
    impact: "A green naming-safety validation can coexist with release-visible naming hazards."
    required_action: "Define release-bound file set, scan directories and reports, align schemas with EXTREF policy, and add negative tests for known misses."
  - id: NSRT-MIN-001
    severity: minor
    title: Root README local checks omit the new naming-safety gate
    evidence:
      - path: README.md
        lines: "48-55"
        detail: "lists older checks but omits validate-all --check and validate-naming-safety.sh release"
    impact: "Contributors following root instructions can miss naming-safety validation."
    recommended_action: "Update contributor-facing check instructions before public release."
