      - tests/fixtures/index.yml
      - tests/golden/index.yml
      - evidence/traceability/index.yml
  missing_artifact_readmes:
    severity: minor
    status: fixed
    added:
      - tests/catalog/README.md
      - tests/fixtures/README.md
      - tests/golden/README.md
      - evidence/traceability/README.md
  flat_scripts_root:
    severity: major
    status: fixed
    organized_into:
