directory_id: MFOS-DIR-REPORTS-CURRENT
path: reports/current
role: validation
maturity: M4_POPULATED
status: current
canonical: false
description: Domain-sharded current report packages, navigation metadata, and repository information architecture outputs.
implementation_allowed:
  production: false
  hosted_daemon: false
  rust_semantic_core: false
  dafny_executable_semantics: false
  semantic_runner: false
  portable_semantic_core: false
  hosted_semantic_prototype: false
  generated_production_code: false
  validation_only: true
phase_allowed_from: phase-0
depends_on:
  - reports/index.yml
allowed_contents:
  - domain subdirectories with README.md and index.yml
  - repository information architecture root reports
  - report package indexes
  - README files
  - index files
forbidden_contents:
  - unsharded top-level domain reports
  - phase-specific report filenames
  - phase gate reports
  - generated report outputs
  - archived or superseded reports
  - production code
  - hosted daemon code
  - semantic runner implementation
  - generated binaries
required_before_agent_assignment:
  - report ID
  - review scope
  - evidence refs
review_status: draft
