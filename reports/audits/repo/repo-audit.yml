duplicate_source_of_truth_risks:
  - id: DUP-SPEC-001
    severity: medium
    paths:
      - docs/design/specs/
      - specs/
    risk: Top-level specs bridge could become a competing normative spec tree.
    mitigation: Only promote through reviewed migration ADR and synchronized index.
  - id: DUP-REQ-001
    severity: medium
    paths:
      - docs/design/registries/requirements.yaml
      - requirements/catalog.yml
      - requirements/requirement.schema.yml
      - requirements/by-domain/
    risk: Top-level requirement files could be mistaken for canonical registry.
    mitigation: Keep top-level files bridge-only until schema-backed migration.
  - id: DUP-SRC-001
    severity: medium
    paths:
      - docs/design/source-matrix/source-matrix.yml
      - docs/design/source-matrix/source-matrix.yaml
      - docs/design/source-matrix/source-matrix.md
      - source-matrix/
      - sources/
    risk: Multiple source matrix/source-card locations could diverge.
    mitigation: Treat source-matrix.yml and cards under docs/design as canonical.
  - id: DUP-AI-001
    severity: medium
    paths:
      - docs/design/specs/21-ai-implementation-contract.md
      - docs/design/prompts/ai-prompts.md
      - ai/contracts/ai-implementation-contract.md
    risk: Draft top-level AI contract could override canonical spec or prompt rules.
    mitigation: Mark top-level contract as downstream or sync it from canonical docs.
  - id: DUP-JA-001
    severity: low
    paths:
      - docs/design/ja/
    risk: Japanese mirror could be mistaken as canonical.
    mitigation: Preserve English-canonical conflict rule and incomplete mirror status.
  - id: DUP-REG-001
    severity: high
    paths:
      - docs/design/registries/tests.yaml
      - docs/design/registries/evidence.yaml
      - docs/design/registries/tasks.yaml
    risk: Draft registry seeds can look like verified tests, evidence, or completed tasks.
    mitigation: Require executable validation and real artifacts before status claims.

