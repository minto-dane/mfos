conclusions:
  - Canonical Phase 0.6 documentation is centralized under docs/design/.
  - Top-level bridge paths generally identify their bridge status.
  - Empty scaffold directories can imply implementation, test, CI, formal, release, or evidence status without supporting artifacts.
  - Draft registries and generated-path names should not be treated as verified implementation or release evidence.
  - Future normative content should not be added to bridge paths before a reviewed migration ADR.
