proposal:
  scope_note: "Concrete mapping covers all current IBM-* source IDs in the audited source matrix."
  canonical_pattern: "EXTREF-IBM-<LEGACY-STEM>"
  alias_field: legacy_source_ids
  alias_policy: "Preserve every old IBM-* canonical ID as a legacy alias on the corresponding source card and index entry."
  normalization_policy: "Validators should accept canonical IDs and legacy aliases; generated outputs should emit canonical EXTREF-* IDs."
  card_id_pattern: "SRC-CARD-<source_id>"
  card_filename_pattern: "docs/design/source-matrix/cards/<source_id>.yml"

