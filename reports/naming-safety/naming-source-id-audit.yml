risks:
  - id: RISK-CARD-PATH-COUPLING
    severity: high
    summary: "source_id, card_id, filename stem, and index card_path are coupled by current validation."
  - id: RISK-NO-ALIAS-SCHEMA
    severity: high
    summary: "No current source-card alias field exists; legacy_source_ids needs schema and validator support before migration."
  - id: RISK-MIXED-REFERENCE-SHAPES
    severity: high
    summary: "References appear as source_refs mappings, source_matrix_ids lists, and pack source_refs string lists."
  - id: RISK-REGEX-PREFIX-LOCK
    severity: medium
    summary: "SOURCE_ID_RE enumerates old prefixes and will not recognize EXTREF IDs until updated."
  - id: RISK-GENERATED-ARTIFACT-DRIFT
    severity: medium
    summary: "Generated and prose artifacts outside the audited set can preserve or reintroduce old canonical IDs."
