$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://mfos.local/schemas/test-fixture.schema.yml"
title: "MFOS Phase 0.9 Fixture Artifact Schema"
description: "Design-only schema for the current deterministic fixture artifacts. It does not implement a fixture loader or semantic evaluator."
type: object
additionalProperties: false
x-mfos:
  phase: "0.9"
  design_only: true
  implementation_allowed: false
  owning_spec: "MFOS-SPEC-32-CONFORMANCE-FIXTURE-FORMAT"
required:
  - fixture_id
  - fixture_version
  - description
  - target_specs
  - target_requirements
  - preconditions
  - initial_state
  - inputs
  - expected_oracle
  - expected_evidence
  - not_allowed
  - status
properties:
  fixture_id:
    type: string
    pattern: "^FIXTURE-MFOS-[A-Z0-9]+-[A-Z0-9-]*[0-9]{4}$"
  fixture_version:
    type: integer
    minimum: 1
  description:
    type: string
    minLength: 1
  target_specs:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: "^docs/design/specs/[0-9]{2}-[a-z0-9-]+\\.md$"
  target_requirements:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: "^MFOS-REQ-[A-Z0-9]+-[0-9]{4}$"
  preconditions:
    type: array
    minItems: 1
    items:
      type: string
  initial_state:
    type: object
    additionalProperties: true
    required:
      - clock
      - security_epoch
      - policy_version
      - objects
    properties:
      clock:
        const: T0
      security_epoch:
        type: integer
        minimum: 1
      policy_version:
        type: integer
        minimum: 1
      objects:
        type: array
        items:
          type: object
  inputs:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - input_id
        - operation
        - deterministic_seed
      properties:
        input_id:
          type: string
          pattern: "^INPUT-MFOS-PHASE09-[0-9]{4}$"
        operation:
          type: string
          pattern: "^[A-Z0-9][A-Z0-9-]{0,96}$"
          description: "MFOS-defined symbolic operation token, not copied external command syntax."
        deterministic_seed:
          type: string
          pattern: "^SEED-MFOS-[A-Z0-9-]+[0-9]{4}$"
  expected_oracle:
    type: string
    pattern: "^tests/golden/[a-z0-9-]+/[a-z0-9-]+\\.yml$"
  expected_evidence:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: "^EV-MFOS-[A-Z0-9]+-[A-Z0-9-]*[0-9]{4}$"
  not_allowed:
    type: array
    contains:
      const: production_claim
    items:
      enum:
        - production_claim
        - external_compatibility_claim
        - host_os_semantics_dependency
  status:
    enum:
      - draft
      - current
      - frozen
