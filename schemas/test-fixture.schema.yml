$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://mfos.local/schemas/test-fixture.schema.yml"
title: "MFOS Executable-Spec Test Fixture Schema"
description: "Design-only schema for deterministic fixture artifacts. This schema does not implement a fixture loader."
type: object
additionalProperties: false
x-mfos:
  phase: "0.9"
  design_only: true
  implementation_allowed: false
  owning_spec: "MFOS-SPEC-32-CONFORMANCE-FIXTURE-FORMAT"
  requirement_refs:
    - MFOS-REQ-EXECSPEC-0101
    - MFOS-REQ-EXECSPEC-0102
    - MFOS-REQ-EXECSPEC-0103
    - MFOS-REQ-EXECSPEC-0104
    - MFOS-REQ-EXECSPEC-0105
    - MFOS-REQ-EXECSPEC-0106
  source_refs:
    - EXTREF-IBM-ZOS-AUTHORIZED-CODE-SCANNER-0001
    - EXTREF-IBM-ZOS-SECURITY-SERVER-0001
    - EXTREF-IBM-ZOS-SMF-INTRODUCTION-0001
    - EXTREF-IBM-ZOS-SYSTEM-INTEGRITY-0001
required:
  - artifact_kind
  - schema_version
  - fixture_id
  - title
  - status
  - profile
  - owning_spec
  - requirement_ids
  - source_refs
  - determinism
  - initial_state
  - inputs
  - dependency_states
properties:
  artifact_kind:
    const: test_fixture
  schema_version:
    const: 1
  schema_metadata:
    $ref: "#/$defs/schema_metadata"
  fixture_id:
    $ref: "#/$defs/fixture_id"
  legacy_ids:
    type: array
    items:
      $ref: "#/$defs/legacy_id"
    uniqueItems: true
  title:
    type: string
    minLength: 1
    maxLength: 160
  status:
    $ref: "#/$defs/artifact_status"
  profile:
    $ref: "#/$defs/profile"
  owning_spec:
    $ref: "#/$defs/spec_ref"
  requirement_ids:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/requirement_id"
  source_refs:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/extref_id"
  determinism:
    $ref: "#/$defs/determinism"
  initial_state:
    type: object
    additionalProperties: false
    required:
      - state_version
      - subjects
      - objects
      - policies
      - audit_streams
      - state_snapshots
    properties:
      state_version:
        const: 1
      subjects:
        type: array
        items:
          $ref: "#/$defs/fixture_entity"
      objects:
        type: array
        items:
          $ref: "#/$defs/fixture_entity"
      policies:
        type: array
        items:
          $ref: "#/$defs/policy_ref"
      audit_streams:
        type: array
        items:
          $ref: "#/$defs/audit_stream_ref"
      state_snapshots:
        type: array
        items:
          $ref: "#/$defs/state_snapshot"
  inputs:
    type: array
    items:
      $ref: "#/$defs/fixture_input"
  dependency_states:
    type: array
    items:
      $ref: "#/$defs/dependency_state"
  forbidden_ambient_inputs:
    type: array
    items:
      enum:
        - wall_clock
        - environment_variables
        - host_user_identity
        - undeclared_host_files
        - network
        - random_device
    uniqueItems: true
  spec_gap_ids:
    type: array
    items:
      $ref: "#/$defs/spec_gap_id"
    uniqueItems: true
$defs:
  forbidden_mfos_owned_token:
    pattern: "(IBM|ZOS|Z-OS|Z_OS|MVS|RACF|JES|JES2|DFSMS|SMF|APF|PRSM|PR-SM|LPAR|ZARCHITECTURE|Z-ARCHITECTURE|ZARCH|ZVM|Z-VM|SDSF|ISPF|TSOE|TSO-E|TSO|ZOSMF|ZOS-MF)"
  schema_metadata:
    type: object
    additionalProperties: false
    required:
      - schema_id
      - design_only
      - source_refs
    properties:
      schema_id:
        allOf:
          - type: string
            pattern: "^MFOS-SCHEMA-EXECSPEC-FIXTURE-[0-9]{4}$"
          - not:
              $ref: "#/$defs/forbidden_mfos_owned_token"
      design_only:
        const: true
      source_refs:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/extref_id"
  artifact_status:
    enum:
      - draft
      - ready_for_review
      - reviewed
      - frozen
      - deprecated
      - superseded
  profile:
    enum:
      - BASELINE
      - ENTERPRISE_STANDALONE
      - ENTERPRISE_PXM
      - HIGH_ASSURANCE
      - DEV
  extref_id:
    type: string
    pattern: "^EXTREF-[A-Z0-9-]+-[0-9]{4}$"
  requirement_id:
    allOf:
      - type: string
        pattern: "^MFOS-REQ-[A-Z0-9]+-[0-9]{4}$"
      - not:
          $ref: "#/$defs/forbidden_mfos_owned_token"
  fixture_id:
    allOf:
      - type: string
        pattern: "^FIX-MFOS-[A-Z0-9]+-[A-Z0-9-]*[0-9]{4}$"
      - not:
          $ref: "#/$defs/forbidden_mfos_owned_token"
  local_ref:
    allOf:
      - type: string
        pattern: "^REF-[A-Z0-9][A-Z0-9-]*$"
      - not:
          $ref: "#/$defs/forbidden_mfos_owned_token"
  mfos_owned_ref:
    allOf:
      - type: string
        pattern: "^MFOS-[A-Z0-9][A-Z0-9-]*$"
      - not:
          $ref: "#/$defs/forbidden_mfos_owned_token"
  operation:
    allOf:
      - type: string
        pattern: "^MFOS_OP_[A-Z0-9_]{1,96}$"
      - not:
          $ref: "#/$defs/forbidden_mfos_owned_token"
  spec_gap_id:
    allOf:
      - type: string
        pattern: "^(SPEC-GAP|[A-Z0-9]+-GAP)-[A-Z0-9-]*[0-9]{4}$"
      - not:
          $ref: "#/$defs/forbidden_mfos_owned_token"
  legacy_id:
    type: string
    minLength: 1
    maxLength: 128
  spec_ref:
    type: object
    additionalProperties: false
    required:
      - spec_id
      - path
    properties:
      spec_id:
        allOf:
          - type: string
            pattern: "^MFOS-SPEC-[A-Z0-9-]+$"
          - not:
              $ref: "#/$defs/forbidden_mfos_owned_token"
      path:
        type: string
        pattern: "^docs/design/specs/[0-9]{2}-[a-z0-9-]+\\.md$"
      section:
        type: string
        minLength: 1
        maxLength: 160
  determinism:
    type: object
    additionalProperties: false
    required:
      - clock_utc
      - security_epoch
      - policy_version
      - ordering
      - randomness
      - network
      - host_filesystem
    properties:
      clock_utc:
        type: string
        format: date-time
      security_epoch:
        type: integer
        minimum: 0
      policy_version:
        type: integer
        minimum: 0
      ordering:
        enum:
          - declaration_order
          - explicit_happens_before
      randomness:
        type: object
        additionalProperties: false
        required:
          - allowed
        properties:
          allowed:
            type: boolean
          seed:
            type: string
            minLength: 1
            maxLength: 128
      network:
        const: disabled
      host_filesystem:
        const: declared_artifacts_only
  fixture_entity:
    type: object
    additionalProperties: false
    required:
      - ref
      - entity_kind
      - generation
      - attributes
    properties:
      ref:
        $ref: "#/$defs/local_ref"
      entity_kind:
        enum:
          - subject
          - object
          - policy
          - audit_stream
          - dependency
      generation:
        type: integer
        minimum: 0
      attributes:
        type: object
        additionalProperties: true
  policy_ref:
    type: object
    additionalProperties: false
    required:
      - ref
      - policy_id
      - policy_version
      - policy_epoch
    properties:
      ref:
        $ref: "#/$defs/local_ref"
      policy_id:
        $ref: "#/$defs/mfos_owned_ref"
      policy_version:
        type: integer
        minimum: 0
      policy_epoch:
        type: integer
        minimum: 0
  audit_stream_ref:
    type: object
    additionalProperties: false
    required:
      - ref
      - stream_id
      - initial_sequence
    properties:
      ref:
        $ref: "#/$defs/local_ref"
      stream_id:
        $ref: "#/$defs/mfos_owned_ref"
      initial_sequence:
        type: integer
        minimum: 0
  state_snapshot:
    type: object
    additionalProperties: false
    required:
      - snapshot_ref
      - digest
    properties:
      snapshot_ref:
        $ref: "#/$defs/local_ref"
      digest:
        type: string
        pattern: "^sha384:[0-9a-f]{96}$"
  fixture_input:
    type: object
    additionalProperties: false
    required:
      - input_id
      - actor_ref
      - operation
      - payload
      - expected_observation_ref
    properties:
      input_id:
        pattern: "^INPUT-[0-9]{4}$"
        type: string
      actor_ref:
        $ref: "#/$defs/local_ref"
      operation:
        $ref: "#/$defs/operation"
      target_ref:
        $ref: "#/$defs/local_ref"
      target_absent:
        type: boolean
      payload:
        type: object
        additionalProperties: true
      expected_observation_ref:
        $ref: "#/$defs/local_ref"
      happens_before:
        type: array
        items:
          pattern: "^INPUT-[0-9]{4}$"
          type: string
        uniqueItems: true
  dependency_state:
    type: object
    additionalProperties: false
    required:
      - dependency_ref
      - state
      - affects_outcome
    properties:
      dependency_ref:
        $ref: "#/$defs/local_ref"
      state:
        enum:
          - AVAILABLE
          - UNAVAILABLE
          - DEGRADED
          - UNSUPPORTED
          - SPEC_GAP
      affects_outcome:
        type: boolean
      expected_error_code:
        type: string
        pattern: "^MFOS_ERR_[A-Z0-9_]{1,96}$"

