$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://mfos.local/schemas/oracle.schema.yml"
title: "MFOS Phase 0.9 Embedded Oracle Schema"
description: "Design-only schema for oracle blocks embedded in Phase 0.9 golden vectors. It does not implement oracle evaluation."
type: object
additionalProperties: false
x-mfos:
  phase: "0.9"
  design_only: true
  implementation_allowed: false
  owning_spec: "MFOS-SPEC-34-ORACLE-DEFINITION-FORMAT"
required:
  - oracle_id
  - oracle_version
  - fixture_ref
  - expected_decisions
  - expected_state_transitions
  - expected_audit_records
  - expected_failure
  - expected_final_state
  - evidence_required
  - status
properties:
  oracle_id:
    type: string
    pattern: "^ORACLE-MFOS-[A-Z0-9]+-[A-Z0-9-]*[0-9]{4}$"
  oracle_version:
    type: integer
    minimum: 1
  fixture_ref:
    type: string
    pattern: "^tests/fixtures/[a-z0-9-]+/[a-z0-9-]+\\.yml$"
  expected_decisions:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: true
      required:
        - decision_id
        - result
        - policy_version
        - obligations
      properties:
        decision_id:
          type: string
          pattern: "^DECISION-MFOS-PHASE09-[0-9]{4}$"
        result:
          enum:
            - ALLOW
            - DENY
            - ALLOW_WITH_AUDIT
            - REQUIRE_MFA
            - REQUIRE_DUAL_CONTROL
            - REQUIRE_BREAK_GLASS
            - REQUIRE_GUARD_APPROVAL
            - REQUIRE_OPERATOR_CONFIRMATION
        policy_version:
          type: integer
        obligations:
          type: array
          items:
            type: string
  expected_state_transitions:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: true
      required:
        - object
        - from
        - action
        - to
        - reason
  expected_audit_records:
    type: array
    minItems: 0
    items:
      type: object
      additionalProperties: true
      required:
        - record_type
        - decision
        - reason_code
        - before_return
      properties:
        before_return:
          type: boolean
  expected_finalization:
    type: object
    additionalProperties: true
    properties:
      audit_available:
        type: boolean
      final_result:
        type: string
      final_error:
        oneOf:
          - type: string
            pattern: "^MFOS_ERR_[A-Z0-9_]{1,96}$"
          - type: "null"
      result_released:
        type: boolean
      records_appended:
        type: integer
        minimum: 0
  expected_protected_resource_release:
    type: object
    additionalProperties: true
    properties:
      handle_created:
        type: boolean
      protected_resource_released:
        type: boolean
  expected_no_silent_success:
    type: boolean
  expected_no_audit_evidence_fabricated:
    type: boolean
  expected_failure:
    type: object
    additionalProperties: false
    required:
      - error_code
      - fail_closed
    properties:
      error_code:
        oneOf:
          - type: string
            pattern: "^MFOS_ERR_[A-Z0-9_]{1,96}$"
          - type: "null"
      fail_closed:
        type: boolean
  expected_final_state:
    type: string
    minLength: 1
  evidence_required:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: "^EV-MFOS-[A-Z0-9]+-[A-Z0-9-]*[0-9]{4}$"
  status:
    enum:
      - draft
      - current
      - frozen
