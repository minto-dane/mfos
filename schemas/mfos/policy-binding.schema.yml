$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://mfos.local/schemas/mfos/policy-binding.schema.yml"
title: "MFOS PolicyBinding Design Schema"
description: "Phase 0.8 design contract for authorization policy bindings. This schema does not authorize production implementation."
type: object
additionalProperties: false
required:
  - schema_metadata
  - implementation_allowed
  - schema_version
  - binding_id
  - policy_id
  - policy_version_min
  - status
  - precedence
  - effect
  - subject_selector
  - object_selector
  - operation_set
  - context_conditions
  - obligations
  - delegation
  - emergency_access
  - dual_control
  - source_matrix_refs
properties:
  schema_metadata:
    type: object
    additionalProperties: false
    required:
      - schema_id
      - status
      - owning_spec
      - source_matrix_ids
    properties:
      schema_id:
        const: "MFOS-SCHEMA-AUTH-POLICY-BINDING-0001"
      status:
        const: "design_freeze"
      owning_spec:
        const: "MFOS-SPEC-06-AUTHORIZATION"
      source_matrix_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/extref_id"
  implementation_allowed:
    const: false
  schema_version:
    const: 1
  binding_id:
    pattern: "^MFOS-AUTH-BINDING-[A-Z0-9][A-Z0-9-]{0,127}$"
    type: string
  policy_id:
    pattern: "^MFOS-AUTH-POLICY-[A-Z0-9][A-Z0-9-]{0,127}$"
    type: string
  policy_version_min:
    minimum: 1
    type: integer
  policy_version_max:
    minimum: 1
    type: integer
  status:
    enum:
      - MFOS_BINDING_DRAFT
      - MFOS_BINDING_STAGED
      - MFOS_BINDING_ACTIVE
      - MFOS_BINDING_RETIRED
      - MFOS_BINDING_ROLLED_BACK
  precedence:
    minimum: 0
    type: integer
  effect:
    enum:
      - MFOS_BINDING_ALLOW
      - MFOS_BINDING_DENY
      - MFOS_BINDING_REQUIRE_MFA
      - MFOS_BINDING_REQUIRE_DUAL_CONTROL
      - MFOS_BINDING_REQUIRE_BREAK_GLASS
      - MFOS_BINDING_REQUIRE_OPERATOR_CONFIRMATION
      - MFOS_BINDING_REQUIRE_GUARD_APPROVAL
  subject_selector:
    $ref: "#/$defs/subject_selector"
  object_selector:
    $ref: "#/$defs/object_selector"
  operation_set:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/operation"
  context_conditions:
    type: array
    items:
      $ref: "#/$defs/context_condition"
  obligations:
    type: array
    items:
      $ref: "#/$defs/authorization_obligation"
  delegation:
    type: object
    additionalProperties: false
    required:
      - delegable
      - max_chain_depth
      - allow_transitive_delegation
      - revocation_invalidates_cache
    properties:
      delegable:
        type: boolean
      max_chain_depth:
        maximum: 8
        minimum: 0
        type: integer
      allow_transitive_delegation:
        type: boolean
      revocation_invalidates_cache:
        const: true
  emergency_access:
    type: object
    additionalProperties: false
    required:
      - permitted
      - maximum_lifetime_minutes
      - reason_required
      - audit_required
      - incident_review_required
    properties:
      permitted:
        type: boolean
      maximum_lifetime_minutes:
        maximum: 60
        minimum: 0
        type: integer
      reason_required:
        const: true
      audit_required:
        const: true
      incident_review_required:
        type: boolean
  dual_control:
    type: object
    additionalProperties: false
    required:
      - required
      - independent_principals_required
      - self_approval_allowed
      - request_bound_token_required
    properties:
      required:
        type: boolean
      independent_principals_required:
        const: true
      self_approval_allowed:
        const: false
      request_bound_token_required:
        const: true
  lint_requirements:
    type: array
    uniqueItems: true
    items:
      pattern: "^MFOS-AUTH-LINT-[0-9]{4}$"
      type: string
  valid_from_utc:
    type: string
  valid_until_utc:
    type: string
  source_matrix_refs:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/extref_id"
$defs:
  extref_id:
    pattern: "^EXTREF-[A-Z0-9-]+-[0-9]{4}$"
    type: string
  mfos_id:
    pattern: "^MFOS-[A-Z0-9][A-Z0-9-]{0,127}$"
    type: string
  operation:
    enum:
      - MFOS_OP_READ
      - MFOS_OP_WRITE
      - MFOS_OP_APPEND
      - MFOS_OP_CREATE
      - MFOS_OP_UPDATE
      - MFOS_OP_DELETE
      - MFOS_OP_PURGE
      - MFOS_OP_EXECUTE
      - MFOS_OP_SUBMIT
      - MFOS_OP_CANCEL
      - MFOS_OP_BROWSE
      - MFOS_OP_EXPORT
      - MFOS_OP_HOLD
      - MFOS_OP_RELEASE
      - MFOS_OP_LOAD
      - MFOS_OP_ACTIVATE
      - MFOS_OP_DEACTIVATE
      - MFOS_OP_ASSIGN
      - MFOS_OP_QUERY
      - MFOS_OP_ADMINISTER
      - MFOS_OP_ATTEST
      - MFOS_OP_DELEGATE
      - MFOS_OP_ROLLBACK
  subject_selector:
    type: object
    additionalProperties: false
    required:
      - selector_id
      - selector_type
    properties:
      selector_id:
        pattern: "^MFOS-AUTH-SUBJECT-SELECTOR-[A-Z0-9][A-Z0-9-]{0,127}$"
        type: string
      selector_type:
        enum:
          - MFOS_SELECTOR_EXACT_SUBJECT
          - MFOS_SELECTOR_PRINCIPAL
          - MFOS_SELECTOR_GROUP
          - MFOS_SELECTOR_ROLE
          - MFOS_SELECTOR_AUTHORITY_CLASS
          - MFOS_SELECTOR_SERVICE
          - MFOS_SELECTOR_OPERATOR_SESSION
      refs:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/mfos_id"
      labels:
        type: array
        uniqueItems: true
        items:
          pattern: "^MFOS_LABEL_[A-Z0-9_]{1,96}$"
          type: string
  object_selector:
    type: object
    additionalProperties: false
    required:
      - selector_id
      - resource_class
      - selector_type
    properties:
      selector_id:
        pattern: "^MFOS-AUTH-OBJECT-SELECTOR-[A-Z0-9][A-Z0-9-]{0,127}$"
        type: string
      resource_class:
        enum:
          - MFOS_RESOURCE_DATASET
          - MFOS_RESOURCE_CATALOG
          - MFOS_RESOURCE_SPOOL
          - MFOS_RESOURCE_JOB
          - MFOS_RESOURCE_PROGRAM
          - MFOS_RESOURCE_AMF_MODULE
          - MFOS_RESOURCE_OPERATOR_COMMAND
          - MFOS_RESOURCE_PARTITION
          - MFOS_RESOURCE_DEVICE
          - MFOS_RESOURCE_AUDIT_STREAM
          - MFOS_RESOURCE_UPDATE_ARTIFACT
          - MFOS_RESOURCE_GUARD_ROOT
          - MFOS_RESOURCE_SECURITY_POLICY
          - MFOS_RESOURCE_WORKLOAD_POLICY
          - MFOS_RESOURCE_AUTHORIZATION_EVIDENCE
      selector_type:
        enum:
          - MFOS_SELECTOR_EXACT_OBJECT
          - MFOS_SELECTOR_PROFILE
          - MFOS_SELECTOR_OWNER
          - MFOS_SELECTOR_NAME_PATTERN
          - MFOS_SELECTOR_PARTITION
      refs:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/mfos_id"
      name_patterns:
        type: array
        uniqueItems: true
        items:
          maxLength: 256
          type: string
      generation_required:
        type: boolean
  context_condition:
    type: object
    additionalProperties: false
    required:
      - condition_id
      - condition_kind
      - fail_closed_on_missing
    properties:
      condition_id:
        pattern: "^MFOS-AUTH-CONTEXT-CONDITION-[A-Z0-9][A-Z0-9-]{0,127}$"
        type: string
      condition_kind:
        enum:
          - MFOS_CONDITION_POLICY_VERSION
          - MFOS_CONDITION_POLICY_EPOCH
          - MFOS_CONDITION_OBJECT_GENERATION
          - MFOS_CONDITION_PARTITION
          - MFOS_CONDITION_TIME_WINDOW
          - MFOS_CONDITION_AUTH_STRENGTH
          - MFOS_CONDITION_OPERATOR_CONFIRMATION
          - MFOS_CONDITION_DUAL_CONTROL
          - MFOS_CONDITION_EMERGENCY_ACCESS
          - MFOS_CONDITION_GUARD_APPROVAL
          - MFOS_CONDITION_DELEGATION_DEPTH
      fail_closed_on_missing:
        const: true
      expected_ref:
        $ref: "#/$defs/mfos_id"
      expected_value:
        type: string
  authorization_obligation:
    type: object
    additionalProperties: false
    required:
      - obligation_id
      - kind
      - required_before_return
      - required_before_effect
      - failure_policy
    properties:
      obligation_id:
        pattern: "^MFOS-AUTH-OBLIGATION-[A-Z0-9][A-Z0-9-]{0,127}$"
        type: string
      kind:
        enum:
          - MFOS_OBL_AUDIT
          - MFOS_OBL_MFA
          - MFOS_OBL_DUAL_CONTROL
          - MFOS_OBL_EMERGENCY_REASON
          - MFOS_OBL_EMERGENCY_EXPIRY
          - MFOS_OBL_OPERATOR_CONFIRMATION
          - MFOS_OBL_GUARD_APPROVAL
          - MFOS_OBL_RATE_LIMIT
          - MFOS_OBL_NOTIFY
          - MFOS_OBL_REMOTE_EXPORT
          - MFOS_OBL_LOCKDOWN
          - MFOS_OBL_POLICY_LINT
          - MFOS_OBL_INCIDENT_REVIEW
      required_before_return:
        type: boolean
      required_before_effect:
        type: boolean
      failure_policy:
        enum:
          - MFOS_OBL_FAIL_CLOSED
          - MFOS_OBL_DEGRADED_READ_ONLY
          - MFOS_OBL_RECOVERY_MODE
      payload_ref:
        $ref: "#/$defs/mfos_id"
