$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://mfos.local/schemas/mfos/job.schema.yml"
title: "MFOS Phase 0.8 Job"
description: "Design schema for a Phase 0.8 MFOS Job object. This is not production code."
type: object
additionalProperties: false
x_mfos_spec_id: "MFOS-SPEC-09-JOB-SPOOL"
x_mfos_source_refs:
  - "EXTREF-IBM-ZOS-JES-INTRODUCTION-0001"
  - "EXTREF-IBM-ZOS-JES-JOB-FLOW-0001"
  - "EXTREF-IBM-ZOS-SECURITY-SERVER-0001"
  - "EXTREF-IBM-ZOS-RACF-RESOURCE-AUTHORIZATION-0001"
  - "EXTREF-IBM-ZOS-SMF-INTRODUCTION-0001"
  - "EXTREF-IBM-ZOS-SMF-RACF-TYPE-80-0001"
required:
  - schema_version
  - job_id
  - job_name
  - submitter_principal
  - job_class
  - service_class
  - message_class
  - status
  - steps
  - spool_refs
  - result
  - accounting
  - audit_correlation_id
properties:
  schema_version:
    const: 1
  job_id:
    type: string
    pattern: '^JOB-[A-Z0-9][A-Z0-9_-]{7,63}$'
    description: "Server-assigned immutable job identifier."
  job_name:
    type: string
    pattern: '^[A-Z][A-Z0-9_-]{0,7}$'
  submitter_principal:
    $ref: "#/$defs/principal_ref"
  requested_principal:
    anyOf:
      - $ref: "#/$defs/principal_ref"
      - type: "null"
    default: null
  effective_principal:
    anyOf:
      - $ref: "#/$defs/principal_ref"
      - type: "null"
    default: null
    description: "Absent until securityd authorizes submit and submit-as, if any."
  job_class:
    type: string
    pattern: '^[A-Z0-9]$'
  service_class:
    type: string
    pattern: '^[A-Z][A-Z0-9_-]{0,31}$'
  message_class:
    type: string
    pattern: '^[A-Z0-9]$'
  status:
    $ref: "#/$defs/job_status"
  failure_state:
    anyOf:
      - $ref: "#/$defs/job_failure_state"
      - type: "null"
    default: null
  failure_reason_code:
    type:
      - string
      - "null"
    pattern: '^[A-Z][A-Z0-9_]{0,63}$'
    default: null
  source:
    type: object
    additionalProperties: false
    required:
      - source_digest
      - source_encoding
      - line_count
      - normalized_by_tooling
    properties:
      source_digest:
        $ref: "#/$defs/digest"
      source_encoding:
        enum:
          - UTF-8
          - BYTES
      line_count:
        type: integer
        minimum: 1
      normalized_by_tooling:
        type: boolean
  steps:
    type: array
    minItems: 1
    items:
      $ref: "job-step.schema.yml"
  spool_refs:
    type: array
    items:
      $ref: "#/$defs/spool_entry_ref"
    uniqueItems: true
  result:
    type: object
    additionalProperties: false
    required:
      - job_return_code
      - max_step_return_code
      - failed_step_id
      - abend_reason
    properties:
      job_return_code:
        anyOf:
          - $ref: "#/$defs/return_code"
          - type: "null"
      max_step_return_code:
        anyOf:
          - $ref: "#/$defs/return_code"
          - type: "null"
      failed_step_id:
        type:
          - string
          - "null"
        pattern: '^STEP-[A-Z0-9][A-Z0-9_-]{7,63}$'
      abend_reason:
        type:
          - string
          - "null"
        maxLength: 256
  accounting:
    type: object
    additionalProperties: false
    required:
      - submitted_at_utc
    properties:
      submitted_at_utc:
        $ref: "#/$defs/timestamp"
      started_at_utc:
        anyOf:
          - $ref: "#/$defs/timestamp"
          - type: "null"
      completed_at_utc:
        anyOf:
          - $ref: "#/$defs/timestamp"
          - type: "null"
      cpu_time_ms:
        type:
          - integer
          - "null"
        minimum: 0
      io_count:
        type:
          - integer
          - "null"
        minimum: 0
  audit_correlation_id:
    $ref: "#/$defs/uuid"
$defs:
  principal_ref:
    type: string
    pattern: '^PRN-[A-Z0-9][A-Z0-9_-]{1,63}$'
  spool_entry_ref:
    type: string
    pattern: '^SPL-[A-Z0-9][A-Z0-9_-]{7,63}$'
  uuid:
    type: string
    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
  timestamp:
    type: string
    format: date-time
  digest:
    type: string
    pattern: '^sha(256|384|512):[0-9a-f]+$'
  return_code:
    type: integer
    minimum: 0
    maximum: 4095
  job_status:
    enum:
      - RECEIVED
      - INPUT
      - CONVERTING
      - JOB_CONTROL_STREAM_ERROR
      - VALIDATED
      - SECURITY_DENIED
      - QUEUED
      - SELECTED
      - EXECUTING
      - OUTPUT
      - COMPLETE
      - FAILED
      - ABENDED
      - CANCELING
      - CANCELED
      - HELD
      - PURGE_PENDING
      - PURGED
      - SPEC_GAP
      - UNSUPPORTED
      - AUDIT_REQUIRED_BUT_UNAVAILABLE
  job_failure_state:
    enum:
      - JOB_CONTROL_STREAM_ERROR
      - SECURITY_DENIED
      - STEP_FAILED
      - ABENDED
      - CANCELED
      - OUTPUT_FAILED
      - AUDIT_REQUIRED_BUT_UNAVAILABLE
      - UNSUPPORTED
      - SPEC_GAP
      - INTERNAL_CORRUPTION
