schema_id: MFOS-SCHEMA-FORMAL-CLAIM-0001
title: FormalClaim
status: draft
phase: Phase 0.10
implementation_allowed: false
type: object
required:
  - claim_id
  - title
  - status
  - requirement_refs
  - protected_assets
  - assumptions
  - not_claimed
  - proof_obligation_refs
  - model_refs
  - evidence_refs
properties:
  claim_id:
    type: string
    pattern: "^MFOS-FC-[A-Z0-9-]+$"
  legacy_claim_id:
    type: string
    pattern: "^MFOS-FORMAL-CLAIM-[A-Z0-9-]+$"
  title:
    type: string
  status:
    enum:
      - planned
      - draft
      - reviewed
  requirement_refs:
    type: array
    minItems: 1
  protected_assets:
    type: array
    minItems: 1
  assumptions:
    type: array
    minItems: 1
  not_claimed:
    type: array
    minItems: 1
  proof_obligation_refs:
    type: array
    minItems: 1
  model_refs:
    type: array
    minItems: 1
  evidence_refs:
    type: array
    minItems: 1
additionalProperties: false
source_refs:
  - EXTREF-NIST-SECURE-SYSTEMS-ENGINEERING-0001
  - EXTREF-NIST-SSDF-0001
requirement_refs:
  - MFOS-REQ-FORMAL-0001
spec_gap_policy: implementation_must_not_infer_or_fill_gaps
