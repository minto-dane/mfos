schema_id: MFOS-SCHEMA-PROOF-OBLIGATION-0001
title: ProofObligation
status: draft
phase: Phase 0.10
implementation_allowed: false
type: object
required:
  - obligation_id
  - claim_ref
  - status
  - statement
  - requirement_refs
  - invariants
  - accepted_tool_refs
  - acceptance_criteria
  - expected_evidence_refs
  - proof_artifact
  - proof_claimed
properties:
  obligation_id:
    type: string
    pattern: "^MFOS-PO-[A-Z0-9-]+$"
  legacy_obligation_id:
    type: string
    pattern: "^MFOS-PROOF-OBLIGATION-[A-Z0-9-]+$"
  claim_ref:
    type: string
    pattern: "^MFOS-FC-[A-Z0-9-]+$"
  status:
    enum:
      - planned
      - draft
      - reviewed
  statement:
    type: string
  requirement_refs:
    type: array
    minItems: 1
  invariants:
    type: array
    minItems: 1
  accepted_tool_refs:
    type: array
    minItems: 1
  acceptance_criteria:
    type: array
    minItems: 1
  expected_evidence_refs:
    type: array
    minItems: 1
  proof_artifact:
    type:
      - "null"
      - string
  proof_claimed:
    const: false
additionalProperties: false
source_refs:
  - EXTREF-NIST-SECURE-SYSTEMS-ENGINEERING-0001
  - EXTREF-NIST-SSDF-0001
requirement_refs:
  - MFOS-REQ-FORMAL-0002
spec_gap_policy: implementation_must_not_infer_or_fill_gaps
