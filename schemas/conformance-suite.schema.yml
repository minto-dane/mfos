$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://mfos.local/schemas/conformance-suite.schema.yml"
title: "MFOS Executable-Spec Conformance Suite Schema"
description: "Design-only schema for conformance suite manifests. This schema does not implement suite execution."
type: object
additionalProperties: false
x-mfos:
  phase: "0.9"
  design_only: true
  implementation_allowed: false
  owning_spec: "MFOS-SPEC-31-EXECUTABLE-SPEC-TEST-HARNESS"
  requirement_refs:
    - MFOS-REQ-EXECSPEC-0009
    - MFOS-REQ-EXECSPEC-0010
  source_refs:
    - EXTREF-IBM-ZOS-AUTHORIZED-CODE-SCANNER-0001
    - EXTREF-IBM-ZOS-SECURITY-SERVER-0001
    - EXTREF-IBM-ZOS-SMF-INTRODUCTION-0001
    - EXTREF-IBM-ZOS-SYSTEM-INTEGRITY-0001
required:
  - artifact_kind
  - schema_version
  - suite_id
  - title
  - status
  - claimed_profile
  - requirement_ids
  - source_refs
  - test_cases
  - coverage
  - execution_contract
properties:
  artifact_kind:
    const: conformance_suite
  schema_version:
    const: 1
  suite_id:
    $ref: "#/$defs/suite_id"
  title:
    type: string
    minLength: 1
    maxLength: 160
  status:
    $ref: "#/$defs/artifact_status"
  claimed_profile:
    $ref: "#/$defs/profile"
  requirement_ids:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/requirement_id"
  source_refs:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/extref_id"
  test_cases:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - test_id
        - fixture_ref
        - oracle_ref
        - required_for_claim
      properties:
        test_id:
          $ref: "#/$defs/test_id"
        fixture_ref:
          $ref: "#/$defs/fixture_ref"
        oracle_ref:
          $ref: "#/$defs/oracle_ref"
        required_for_claim:
          type: boolean
        requirement_ids:
          type: array
          items:
            $ref: "#/$defs/requirement_id"
          uniqueItems: true
  coverage:
    type: object
    additionalProperties: false
    required:
      - requirement_coverage
      - unsupported_features
      - spec_gaps
    properties:
      requirement_coverage:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
            - requirement_id
            - status
          properties:
            requirement_id:
              $ref: "#/$defs/requirement_id"
            status:
              enum:
                - satisfied_by_suite
                - partial
                - unsupported
                - spec_gap
                - blocked
      unsupported_features:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 160
      spec_gaps:
        type: array
        items:
          $ref: "#/$defs/spec_gap_id"
        uniqueItems: true
  execution_contract:
    type: object
    additionalProperties: false
    required:
      - implementation_allowed
      - runner_required_for_execution
      - semantic_evaluator_embedded
      - ordering
    properties:
      implementation_allowed:
        const: false
      runner_required_for_execution:
        type: boolean
      semantic_evaluator_embedded:
        const: false
      ordering:
        enum:
          - listed_order
          - dependency_order
  release_binding:
    type: object
    additionalProperties: false
    required:
      - production_claim_allowed
    properties:
      production_claim_allowed:
        const: false
      release_id:
        type: string
        pattern: "^MFOS-REL-[0-9]{8}(?:-[A-Za-z0-9._-]+)?$"
  notes:
    type: string
    maxLength: 1000
$defs:
  forbidden_mfos_owned_token:
    pattern: "(IBM|ZOS|Z-OS|Z_OS|MVS|RACF|JES|JES2|DFSMS|SMF|APF|PRSM|PR-SM|LPAR|ZARCHITECTURE|Z-ARCHITECTURE|ZARCH|ZVM|Z-VM|SDSF|ISPF|TSOE|TSO-E|TSO|ZOSMF|ZOS-MF)"
  artifact_status:
    enum:
      - draft
      - ready_for_review
      - reviewed
      - frozen
      - deprecated
      - superseded
  profile:
    enum:
      - BASELINE
      - ENTERPRISE_STANDALONE
      - ENTERPRISE_PXM
      - HIGH_ASSURANCE
      - DEV
  extref_id:
    type: string
    pattern: "^EXTREF-[A-Z0-9-]+-[0-9]{4}$"
  requirement_id:
    allOf:
      - type: string
        pattern: "^MFOS-REQ-[A-Z0-9]+-[0-9]{4}$"
      - not:
          $ref: "#/$defs/forbidden_mfos_owned_token"
  test_id:
    allOf:
      - type: string
        pattern: "^(TEST|NEG)-MFOS-[A-Z0-9]+-[A-Z0-9-]*[0-9]{4}$"
      - not:
          $ref: "#/$defs/forbidden_mfos_owned_token"
  fixture_ref:
    allOf:
      - type: string
        pattern: "^FIX-MFOS-[A-Z0-9]+-[A-Z0-9-]*[0-9]{4}$"
      - not:
          $ref: "#/$defs/forbidden_mfos_owned_token"
  oracle_ref:
    allOf:
      - type: string
        pattern: "^ORACLE-MFOS-[A-Z0-9]+-[A-Z0-9-]*[0-9]{4}$"
      - not:
          $ref: "#/$defs/forbidden_mfos_owned_token"
  suite_id:
    allOf:
      - type: string
        pattern: "^SUITE-MFOS-[A-Z0-9]+-[A-Z0-9-]*[0-9]{4}$"
      - not:
          $ref: "#/$defs/forbidden_mfos_owned_token"
  spec_gap_id:
    allOf:
      - type: string
        pattern: "^(SPEC-GAP|[A-Z0-9]+-GAP)-[A-Z0-9-]*[0-9]{4}$"
      - not:
          $ref: "#/$defs/forbidden_mfos_owned_token"

