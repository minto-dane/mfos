entries:
- test_id: TEST-MFOS-AUDIT-RECORD-SCHEMA-0101
  title: AuditRecord schema accepts a complete security decision record
  test_type: design_positive
  status: planned_design
  target_spec: docs/design/specs/07-audit.md
  target_requirements:
  - MFOS-REQ-AUDIT-0101
  requirement_ids:
  - MFOS-REQ-AUDIT-0101
  preconditions:
  - Phase 0.8 semantics freeze artifacts are available.
  - No production or hosted daemon implementation is started.
  input: AuditRecord contains schema_version, record_id, timestamp_utc, partition_id, component_id, correlation_id, subject, object, operation, decision, reason_code, policy_version, previous_hash, payload_hash, and record_hash.
  expected_decision: schema-valid record is accepted for planned append review.
  expected_audit: audit obligation is present where the target requirement declares one
  expected_failure_mode: none_for_positive_case
  evidence_required:
  - test_result
  - traceability_link
  - red_team_review_record
  phase_to_implement: Phase 0.9 or later
  expected_result: schema-valid record is accepted for planned append review.
  coverage_note: Concrete Phase 0.8 planned semantic test.
