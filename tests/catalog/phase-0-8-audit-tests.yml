evidence_requirements:
- evidence_id: EV-MFOS-AUDIT-SCHEMA-0001
  description: Positive and negative AuditRecord schema validation results.
  must_include:
  - schema_version
  - test_id
  - fixture_path
  - validation_result
- evidence_id: EV-MFOS-AUDIT-ORDERING-0002
  description: Deny-before-return trace with durable append before caller-visible result.
  must_include:
  - correlation_id
  - stream_id
  - record_seq
  - record_hash
  - caller_result_time
- evidence_id: EV-MFOS-AUDIT-HASHCHAIN-0003
  description: Hash-chain verification over valid, tampered, missing-record, and rollover cases.
  must_include:
  - stream_id
  - sequence_range
  - previous_hash
  - canonical_record_hash
  - record_hash
- evidence_id: EV-MFOS-AUDIT-FAILURE-POLICY-0004
  description: Profile-specific audit failure behavior under unavailable auditd, full store, export failure, and Guard failure.
  must_include:
  - profile
  - failure_mode
  - expected_result
  - observed_result
- evidence_id: EV-MFOS-AUDIT-QUERY-REDACTION-0005
  description: Authorized query, unauthorized query, redacted export, and immutable committed record evidence.
  must_include:
  - securityd_decision_id
  - redaction_policy
  - query_result
  - immutable_record_check
- evidence_id: EV-MFOS-AUDIT-STATE-MACHINE-0006
  description: State-machine review or model-check result for audit append invariants.
  must_include:
  - formal_ref
  - invariants_checked
  - invalid_transitions_checked
  - result
