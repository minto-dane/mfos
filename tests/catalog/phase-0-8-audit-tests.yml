  - Phase 0.8 semantics freeze artifacts are available.
  - No production or hosted daemon implementation is started.
  input: Security decision AuditRecord omits correlation_id or uses an empty correlation_id.
  expected_decision: schema invalid; no record is committed as audit evidence.
  expected_audit: audit obligation is present where the target requirement declares one
  expected_failure_mode: specified_error_without_side_effect_or_fake_success
