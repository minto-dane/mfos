catalog_kind: phase_0_8_first_vertical_slice_tests
status: draft
implementation_allowed: false
entries:
- test_id: TEST-MFOS-VSLICE-HELLO-0001
  test_type: positive
  target_spec: docs/design/specs/30-first-vertical-slice-contract.md
  target_requirements:
  - MFOS-REQ-OPER-0101
  - MFOS-REQ-AUTH-0101
  - MFOS-REQ-CATALOG-0101
  - MFOS-REQ-DATASET-0101
  - MFOS-REQ-JOB-0101
  - MFOS-REQ-SPOOL-0101
  - MFOS-REQ-AUDIT-0102
  preconditions:
  - ALICE principal exists
  - USER.ALICE.INPUT committed catalog entry exists
  input:
    flow: HELLO job success path
  expected_decision: ALLOW
  expected_audit:
  - JOB_SUBMIT
  - DATASET_OPEN_ALLOW
  - STEP_EXECUTE
  - SPOOL_CREATE
  - JOB_COMPLETE
  expected_failure_mode: null
  evidence_required:
  - EV-MFOS-VSLICE-HELLO-0001
  phase_to_implement: Phase 0.9 or later
- test_id: NEG-MFOS-VSLICE-BOB-DENIED-0001
  test_type: negative
  target_spec: docs/design/specs/30-first-vertical-slice-contract.md
  target_requirements:
  - MFOS-REQ-AUTH-0102
  - MFOS-REQ-AUDIT-0102
  - MFOS-REQ-DATASET-0101
  - MFOS-REQ-JOB-0102
  - MFOS-REQ-SPOOL-0101
  preconditions:
  - BOB principal exists
  - BOB lacks READ for USER.ALICE.INPUT
  input:
    flow: BOB denied ALICE dataset failure path
  expected_decision: DENY
  expected_audit:
  - OPEN_DENY before jobd final result
  expected_failure_mode: MFOS_ERR_POLICY_DENIED
  evidence_required:
  - EV-MFOS-VSLICE-BOB-DENIED-0001
  phase_to_implement: Phase 0.9 or later
- test_id: TEST-MFOS-FVS-HELLO-SUCCESS-0001
  test_type: integration
  target_spec: docs/design/specs/30-first-vertical-slice-contract.md
  target_requirements:
  - MFOS-REQ-OPER-0101
  - MFOS-REQ-AUTH-0101
  - MFOS-REQ-AUTH-0102
  - MFOS-REQ-CATALOG-0101
  - MFOS-REQ-DATASET-0101
  - MFOS-REQ-JOB-0101
  - MFOS-REQ-JOB-0102
  - MFOS-REQ-SPOOL-0101
  - MFOS-REQ-AUDIT-0102
  sequence_ids:
  - H01
  - H02
  - H03
  - H04
  - H05
  - H06
  - H07
  - H08
  - H09
  - H10
  - H11
  - H12
  - H13
  - H14
  - H15
  - H16
  - H17
  - H18
  - H19
  - H20
  - H21
  - H22
  expected_result: HELLO completes RC=0 after typed operator submit, securityd allow decisions, committed catalog resolution, bound dataset handle, protected OUTPUT_STREAM, and audit evidence.
  domain_obligations:
    operator_command: SUBMIT INLINE is parsed, target-resolved, authorized, audited, and displayed through operatord.
    authorization_decision: securityd allows submit, submit-as when required, ALICE READ, program execute, spool create, and display.
    catalog_resolution: USER.ALICE.INPUT resolves only from a committed catalog entry and supplies generation metadata.
    dataset_handle: datasetd creates one active READ handle bound to ALICE, policy version, generations, expiry, and correlation ID.
    job_lifecycle: jobd establishes effective principal before resource open and completes RC=0.
    spool: spoold creates, writes, closes, and protects HELLO OUTPUT_STREAM.
    audit_evidence: auditd evidence exists for command, decision, dataset open, job, spool, and completion events.
  side_effect_assertions:
  - no dataset handle exists before securityd allow and audit obligation establishment
  - ECHO does not execute before input handle and OUTPUT_STREAM target are ready
  - spool output and console display are not accepted as audit evidence
  evidence_required:
  - EV-MFOS-FVS-HELLO-SUCCESS-0001
  phase_to_implement: Phase 0.9 or later
- test_id: NEG-MFOS-FVS-BOB-DENIED-0001
  test_type: negative
  target_spec: docs/design/specs/30-first-vertical-slice-contract.md
  target_requirements:
  - MFOS-REQ-OPER-0101
  - MFOS-REQ-AUTH-0101
  - MFOS-REQ-AUTH-0102
  - MFOS-REQ-AUDIT-0102
  - MFOS-REQ-CATALOG-0101
  - MFOS-REQ-DATASET-0101
  - MFOS-REQ-JOB-0101
  - MFOS-REQ-JOB-0102
  - MFOS-REQ-SPOOL-0101
  sequence_ids:
  - B01
  - B02
  - B03
  - B04
  - B05
  - B06
  - B07
  - B08
  - B09
  - B10
  - B11
  - B12
  - B13
  - B14
  - B15
  - B16
  - B17
  - B18
  expected_result: BAD fails with POLICY_DENIED after BOB READ denial; no dataset handle exists; deny audit durable append precedes final denied result and operator display.
  domain_obligations:
    operator_command: DEFINE USER BOB and SUBMIT INLINE are typed, authorized, and audited.
    authorization_decision: securityd allows submit as BOB when fixture policy permits and denies BOB READ on USER.ALICE.INPUT.
    catalog_resolution: catalogd resolves USER.ALICE.INPUT for decision context but does not grant access.
    dataset_handle: datasetd creates no active, cached, deferred, placeholder, closing, or reusable handle.
    job_lifecycle: jobd binds effective principal BOB, fails the step at DD open, and does not execute ECHO against protected content.
    spool: spoold captures a protected failure summary only when authorized and without protected dataset content.
    audit_evidence: DATASET_OPEN_DENY or equivalent deny record is durable before final denial.
  side_effect_assertions:
  - no DATASET_OPEN_ALLOW record for BOB reading USER.ALICE.INPUT
  - no DATASET_CLOSE record for a nonexistent BOB handle
  - no protected dataset content appears in the failure summary
  - no operator final display occurs before required deny audit
  evidence_required:
  - EV-MFOS-FVS-BOB-DENIED-0001
  phase_to_implement: Phase 0.9 or later
- test_id: TEST-MFOS-FVS-AUDIT-ORDER-0001
  test_type: integration
  target_spec: docs/design/specs/30-first-vertical-slice-contract.md
  target_requirements:
  - MFOS-REQ-AUDIT-0102
  - MFOS-REQ-AUTH-0102
  - MFOS-REQ-DATASET-0101
  sequence_ids:
  - B11
  - B12
  - B13
  - B18
  expected_result: Required deny audit reaches durable append before datasetd returns final denied open to jobd and before operatord displays the final failed job result.
  side_effect_assertions:
  - denied result is not caller-visible without deny audit evidence
  - failed required deny audit returns audit-unavailable or profile fail-closed result, not ordinary denial success
  evidence_required:
  - EV-MFOS-FVS-AUDIT-ORDER-0001
  phase_to_implement: Phase 0.9 or later
- test_id: NEG-MFOS-FVS-NO-DATASET-HANDLE-0001
  test_type: negative
  target_spec: docs/design/specs/30-first-vertical-slice-contract.md
  target_requirements:
  - MFOS-REQ-AUTH-0102
  - MFOS-REQ-DATASET-0101
  - MFOS-REQ-JOB-0102
  sequence_ids:
  - B10
  - B11
  - B12
  - B13
  expected_result: Denied BOB open cannot create any active, closing, cached, deferred, placeholder, or reusable dataset handle.
  side_effect_assertions:
  - no handle ID is returned to jobd
  - no stale handle can later be used by BAD or another BOB job
  - no handle close or revoke is required for the denied open because no handle exists
  evidence_required:
  - EV-MFOS-FVS-NO-HANDLE-0001
  phase_to_implement: Phase 0.9 or later
- test_id: TEST-MFOS-FVS-SPOOL-SUMMARY-0001
  test_type: integration
  target_spec: docs/design/specs/30-first-vertical-slice-contract.md
  target_requirements:
  - MFOS-REQ-SPOOL-0101
  - MFOS-REQ-AUDIT-0104
  - MFOS-REQ-JOB-0102
  sequence_ids:
  - B14
  - B15
  - B16
  - B17
  expected_result: BAD failure summary is written to a protected spool entry after dataset deny, contains no protected dataset content, and is not treated as audit evidence.
  side_effect_assertions:
  - failure summary includes reason metadata only
  - failure summary does not satisfy DATASET_OPEN_DENY evidence requirement
  - browse or display of the summary still requires authorization
  evidence_required:
  - EV-MFOS-FVS-SPOOL-SUMMARY-0001
  phase_to_implement: Phase 0.9 or later
- test_id: NEG-MFOS-FVS-SPOOL-NOT-AUDIT-0001
  test_type: negative
  target_spec: docs/design/specs/30-first-vertical-slice-contract.md
  target_requirements:
  - MFOS-REQ-AUDIT-0104
  - MFOS-REQ-SPOOL-0101
  expected_result: Spool output, console output, and ordinary diagnostic logs cannot satisfy required audit evidence for protected decisions.
  side_effect_assertions:
  - removing audit evidence while preserving spool content keeps the test failed
  - console display without audit evidence keeps the test failed
  evidence_required:
  - EV-MFOS-FVS-SPOOL-NOT-AUDIT-0001
  phase_to_implement: Phase 0.9 or later
