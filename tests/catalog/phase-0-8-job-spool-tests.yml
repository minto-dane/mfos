  target_subsystem: spoold
  preconditions:
  - A closed OUTPUT_STREAM SpoolEntry exists.
  - purge_after_utc is in the past.
  - securityd allows SPOOL PURGE.
  steps:
  - Request purge.
  - Verify retention eligibility, authorization, audit, PURGE_PENDING, and PURGED.
  - Attempt browse using the old spool_id.
  expected_result: Purge reaches PURGED; later browse returns MFOS_ERR_STALE_SPOOL_REF with no content.
  expected_absence:
  - no purge before audit obligation
  - no content returned after purge
  expected_error_code: null
  audit_expectations:
  - SPOOL_PURGE_ALLOW
  - SPOOL_PURGED
  evidence_ids:
  - EV-MFOS-SPOOL-FORMAL-0001
