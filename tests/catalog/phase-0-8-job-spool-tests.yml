  evidence_ids:
  - EV-MFOS-SPOOL-SCHEMA-0001
- test_id: TEST-MFOS-SPOOL-0002
  title: Retention-satisfied purge removes content and makes references stale
  test_type: integration
  status: draft
  requirement_ids:
  - MFOS-REQ-SPOOL-0002
  - MFOS-REQ-SPOOL-0004
  - MFOS-REQ-SPOOL-0005
  source_matrix_ids:
