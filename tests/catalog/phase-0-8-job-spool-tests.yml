spec_gaps:
- gap_id: SPEC-GAP-JOB-0001
  summary: Final production program loader contract and module dataset schema.
  required_test_response: Undefined program namespaces return MFOS_ERR_SPEC_GAP with no execution.
- gap_id: SPEC-GAP-JOB-0002
  summary: Temporary dataset lifetime for DISP=TEMP.
  required_test_response: DISP=TEMP returns MFOS_ERR_UNSUPPORTED until lifetime is specified.
- gap_id: SPEC-GAP-JOB-0003
  summary: Restart metadata and restart safety rules.
  required_test_response: Restart requests return MFOS_ERR_SPEC_GAP.
- gap_id: SPEC-GAP-JOB-0004
  summary: Multi-step conditional execution.
  required_test_response: Conditional grammar returns MFOS_ERR_UNSUPPORTED.
- gap_id: SPEC-GAP-SPOOL-0001
  summary: Binary spool record format.
  required_test_response: External compatibility claims are rejected.
- gap_id: SPEC-GAP-SPOOL-0002
  summary: Quota hierarchy and emergency override.
  required_test_response: Quota ambiguity fails closed.
- gap_id: SPEC-GAP-SPOOL-0003
  summary: External print/export gateway.
  required_test_response: Raw destinations return MFOS_ERR_SPEC_GAP.
