- test_id: TEST-MFOS-SPOOL-0001
  title: Job owner browses closed OUTPUT_STREAM after securityd authorization
  test_type: integration
  status: draft
  requirement_ids:
  - MFOS-REQ-SPOOL-0001
  - MFOS-REQ-SPOOL-0002
  - MFOS-REQ-SPOOL-0003
