- test_id: TEST-MFOS-JOB-0001
  title: Authorized MFOS job-control stream job reads dataset, writes OUTPUT_STREAM, and completes RC 0
  test_type: integration
  status: draft
  requirement_ids:
  - MFOS-REQ-JOB-0001
  - MFOS-REQ-JOB-0003
  - MFOS-REQ-JOB-0004
  - MFOS-REQ-JOB-0005
  - MFOS-REQ-SPOOL-0001
  - MFOS-REQ-SPOOL-0003
  source_matrix_ids:
  - EXTREF-IBM-ZOS-JES-INTRODUCTION-0001
  - EXTREF-IBM-ZOS-JES-JOB-FLOW-0001
  - EXTREF-IBM-ZOS-DFSMS-CATALOGS-0001
  - EXTREF-IBM-ZOS-SECURITY-SERVER-0001
  - EXTREF-IBM-ZOS-SMF-INTRODUCTION-0001
  target_subsystem: jobd-spoold
  preconditions:
  - ALICE principal exists and can submit class A jobs.
  - USER.ALICE.INPUT exists in catalogd and ALICE can READ it.
  - Program ECHO is available as a normal-authority test program.
  - MSGCLASS A is valid.
  steps:
  - Submit a MFOS job-control stream job with one EXEC PGM=ECHO, one dataset DD, and one OUTPUT_STREAM DD.
  - Establish effective principal ALICE.
  - Resolve dataset DD through catalogd, securityd, auditd, and datasetd.
  - Create OUTPUT_STREAM through securityd, auditd, and spoold.
  - Complete the step with return_code 0.
  expected_result: Job reaches COMPLETE with job_return_code 0 and one closed OUTPUT_STREAM SpoolEntry.
  expected_absence:
  - no dataset handle before effective_principal
  - no OUTPUT_STREAM content visible before browse authorization
  - no compatibility claim
  expected_error_code: null
  audit_expectations:
  - JOB_SUBMIT_ALLOW
  - JOB_DD_RESOLVE
  - SPOOL_CREATE_ALLOW
  - JOB_STEP_COMPLETE
  - JOB_COMPLETE
  evidence_ids:
  - EV-MFOS-JOB-SPOOL-LEAD-0001
- test_id: TEST-MFOS-JOB-0002
  title: MFOS job-control stream conversion preserves source locations and ordered job graph
  test_type: unit
  status: draft
  requirement_ids:
  - MFOS-REQ-JOB-0001
  - MFOS-REQ-JOB-0002
  - MFOS-REQ-JOB-0007
  source_matrix_ids:
  - EXTREF-IBM-ZOS-JES-INTRODUCTION-0001
  - EXTREF-IBM-ZOS-JES-JOB-FLOW-0001
  target_subsystem: jobd
  preconditions:
  - MFOS job-control stream parser exists in a non-production semantic test harness.
  steps:
  - Parse one JOB card, two EXEC cards, comments, a dataset DD, inline INPUT_STREAM, and OUTPUT_STREAM.
  - Inspect parser diagnostics and internal graph.
  expected_result: Parser emits one Job, two ordered JobSteps, source locations, and DD bindings to nearest preceding step.
  expected_absence:
  - no security decision in parser output
  - no dataset handle in parser output
  - no spool handle in parser output
  expected_error_code: null
  audit_expectations: []
  evidence_ids:
  - EV-MFOS-JOB-SCHEMA-0001
- test_id: TEST-MFOS-JOB-0003
  title: USER omitted defaults effective principal to submitter after authorization
  test_type: integration
  status: draft
  requirement_ids:
  - MFOS-REQ-JOB-0003
  - MFOS-REQ-JOB-0006
  source_matrix_ids:
  - EXTREF-IBM-ZOS-JES-INTRODUCTION-0001
  - EXTREF-IBM-ZOS-SECURITY-SERVER-0001
  - EXTREF-IBM-ZOS-RACF-RESOURCE-AUTHORIZATION-0001
  target_subsystem: jobd
  preconditions:
  - ALICE can submit class A jobs.
  - The JOB card omits USER.
  steps:
  - Submit the job as ALICE.
  - Complete submit authorization through securityd.
  expected_result: effective_principal is ALICE and no submit-as decision is recorded.
