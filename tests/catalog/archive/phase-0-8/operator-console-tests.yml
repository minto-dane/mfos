  status: planned
  evidence: positive-test-results
- test_id: TEST-MFOS-OPER-AUTOMATION-0001
  test_type: integration
  requirement_ids:
  - MFOS-REQ-OPER-0006
  title: Automation DISPLAY JOB uses normal lifecycle
  expected_result: Automation principal submits DISPLAY JOB through parser, target
