  evidence: positive-test-results
- test_id: TEST-MFOS-OPER-CANCEL-0001
  test_type: integration
  requirement_ids:
  - MFOS-REQ-OPER-0003
  - MFOS-REQ-OPER-0005
  title: CANCEL JOB requires reason and audit
  expected_result: Queued job cancel with valid authority records reason and audit
