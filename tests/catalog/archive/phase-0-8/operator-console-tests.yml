  test_type: integration
  requirement_ids:
  - MFOS-REQ-OPER-0003
  - MFOS-REQ-OPER-0005
  - MFOS-REQ-OPER-0007
  title: DISPLAY SYSTEM authorized and audited
  expected_result: Authenticated operator receives typed display frame only after
    command authorization and required audit.
