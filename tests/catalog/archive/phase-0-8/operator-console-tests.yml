  requirement_ids:
  - MFOS-REQ-OPER-0002
  - MFOS-REQ-OPER-0003
  - MFOS-REQ-OPER-0005
  title: DEFINE DATASET routes as typed workflow
  expected_result: Dataset define command resolves catalog target, authorizes, audits
