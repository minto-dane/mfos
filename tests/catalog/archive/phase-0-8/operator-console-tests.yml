- test_id: NEG-MFOS-OPER-EMERGENCY-0001
  test_type: negative
  requirement_ids:
  - MFOS-REQ-OPER-0008
  title: Emergency without reason or expiry denied
  expected_result: Emergency state is not activated and denial is audited when possible.
