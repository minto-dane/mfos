  evidence: positive-test-results
- test_id: TEST-MFOS-OPER-SUBMIT-0001
  test_type: integration
  requirement_ids:
  - MFOS-REQ-OPER-0002
  - MFOS-REQ-OPER-0005
  title: SUBMIT INLINE routes payload as job data
  expected_result: Inline payload is bounded data, not shell text; jobd receives typed
