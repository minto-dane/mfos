- test_id: NEG-MFOS-OPER-DUAL-0001
  test_type: negative
  requirement_ids:
  - MFOS-REQ-OPER-0004
  title: Same-actor dual control denied
  expected_result: Approval by requester is rejected even when requester has multiple
