  status: planned
  evidence: negative-test-results
- test_id: NEG-MFOS-OPER-AUTOMATION-0001
  test_type: negative
  requirement_ids:
  - MFOS-REQ-OPER-0006
  title: Automation direct service bypass denied
  expected_result: Automation attempt to call internal dataset define path directly
