tests:
- test_id: TEST-MFOS-OPER-BOOT-0001
  test_type: conformance
  requirement_ids:
  - MFOS-REQ-OPER-0001
  title: Boot reaches operator console, not root shell
  expected_result: First interactive surface is operatord console; no root shell prompt
    is available.
  status: planned
  evidence: no-root-shell-boot-report
- test_id: TEST-MFOS-OPER-PARSE-0001
  test_type: unit
  requirement_ids:
  - MFOS-REQ-OPER-0002
  - MFOS-REQ-OPER-0009
  title: Valid grammar creates typed OperatorCommand
  expected_result: Each valid Phase 0.8 command parses into an OperatorCommand with
    command_id, raw_text_hash, parsed_name, authority_class, risk_class, and typed
    command_args.
  status: planned
  evidence: grammar-review-record
- test_id: TEST-MFOS-OPER-SCHEMA-0001
  test_type: conformance
  requirement_ids:
  - MFOS-REQ-OPER-0003
  title: OperatorCommand schema accepts valid commands
  expected_result: Valid command, command result, display frame, and dual-control
    examples conform to schemas/mfos/operator-command.schema.yml.
  status: planned
