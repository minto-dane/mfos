  evidence: negative-test-results
- test_id: NEG-MFOS-OPER-EMERGENCY-0002
  test_type: negative
  requirement_ids:
  - MFOS-REQ-OPER-0008
  title: Emergency cannot disable auditd
  expected_result: Attempt to disable auditd through emergency context is denied and
