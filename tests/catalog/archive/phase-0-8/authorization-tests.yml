  - MFOS-REQ-AUTH-0012
  source_matrix_ids:
  - EXTREF-IBM-ZOS-SYSTEM-INTEGRITY-0001
  preconditions:
  - Resource and operation pair is specified but unavailable.
  steps:
  - Request known unimplemented operation.
  expected_result: MFOS_ERR_UNSUPPORTED
  expected_absence:
  - no fake success
  - no protected effect
  audit_expectations:
  - Unsupported decision is auditable when security-sensitive.
  evidence_ids:
