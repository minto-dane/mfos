  source_matrix_ids:
  - EXTREF-IBM-ZOS-SMF-INTRODUCTION-0001
  - EXTREF-IBM-ZOS-SMF-RACF-TYPE-80-0001
  preconditions:
  - Decision requires pre-effect audit and audit service is unavailable.
  steps:
  - Request an operation with required audit obligation.
  - Attempt to proceed to effect.
  expected_result: MFOS_ERR_AUDIT_REQUIRED_BUT_UNAVAILABLE
  expected_absence:
  - no protected effect
  - no diagnostic log substituted for audit
  audit_expectations:
