entries:
- test_id: TEST-MFOS-AUTH-POS-0001
  title: Dataset read allow decision binds subject object operation and policy version
  test_type: integration
  status: design
  requirement_ids:
  - MFOS-REQ-AUTH-0001
  - MFOS-REQ-AUTH-0002
  - MFOS-REQ-AUTH-0004
  source_matrix_ids:
  - EXTREF-IBM-ZOS-SYSTEM-INTEGRITY-0001
  - EXTREF-IBM-ZOS-RACF-RESOURCE-AUTHORIZATION-0001
  - EXTREF-IBM-ZOS-DFSMS-CATALOGS-0001
  preconditions:
  - Matching subject, dataset object, READ operation, policy version, and resource
    profile exist.
  steps:
  - Submit a design-level DecisionRequest for dataset READ.
  - Validate SecurityDecision fields and handle constraints.
  expected_result: MFOS_AUTH_ALLOW or MFOS_AUTH_ALLOW_WITH_OBLIGATIONS with matching
    policy_version and object generation.
  expected_absence:
  - no unbound dataset handle
  - no policy-version-free allow
  audit_expectations:
  - Allow audit obligation is present when profile requires it.
  evidence_ids:
  - EV-MFOS-AUTH-TESTCAT-0001
- test_id: TEST-MFOS-AUTH-POS-0002
  title: Job submit allow with audit obligation enforces before-return barrier
  test_type: integration
  status: design
  requirement_ids:
  - MFOS-REQ-AUTH-0003
  - MFOS-REQ-AUTH-0005
  - MFOS-REQ-AUTH-0013
  source_matrix_ids:
  - EXTREF-IBM-ZOS-JES-INTRODUCTION-0001
  - EXTREF-IBM-ZOS-SMF-INTRODUCTION-0001
  preconditions:
  - Job subject has submit authority and audit is available.
  steps:
  - Request job submit authorization.
  - Check audit obligation timing.
  expected_result: Job submit decision carries required audit obligation before final
    caller result.
  expected_absence:
  - no job accepted before required audit barrier
  audit_expectations:
  - Security decision audit includes subject, job object, operation, reason_code,
    and policy_version.
  evidence_ids:
  - EV-MFOS-AUTH-AUDIT-0001
- test_id: TEST-MFOS-AUTH-POS-0003
  title: Operator display command with matching authority returns allow
  test_type: integration
  status: design
  requirement_ids:
  - MFOS-REQ-AUTH-0006
  source_matrix_ids:
  - EXTREF-IBM-ZOS-SECURITY-SERVER-0001
  - EXTREF-IBM-ZOS-SMF-RACF-TYPE-80-0001
  preconditions:
  - Operator session is trusted and has display authority.
  steps:
  - Parse typed command into an operator command object.
  - Request authorization for MFOS_OP_EXECUTE.
  expected_result: MFOS_AUTH_ALLOW with command object binding and audit obligation
    according to profile.
  expected_absence:
  - no shell command interpretation
  audit_expectations:
  - Operator command decision is auditable.
  evidence_ids:
  - EV-MFOS-AUTH-TESTCAT-0001
- test_id: TEST-MFOS-AUTH-POS-0004
  title: Destructive operator command requires confirmation before effect
  test_type: integration
  status: design
  requirement_ids:
  - MFOS-REQ-AUTH-0003
  - MFOS-REQ-AUTH-0006
  source_matrix_ids:
  - EXTREF-IBM-ZOS-SECURITY-SERVER-0001
  - EXTREF-IBM-ZOS-SMF-INTRODUCTION-0001
  preconditions:
  - Operator has authority but command binding requires confirmation.
  steps:
  - Request destructive command authorization without confirmation.
  - Present request-bound confirmation token.
  expected_result: Initial result is MFOS_AUTH_REQUIRE_OPERATOR_CONFIRMATION; later
    result can allow after valid confirmation.
  expected_absence:
  - no destructive side effect before confirmation
  audit_expectations:
  - Confirmation requirement and final decision are auditable.
  evidence_ids:
  - EV-MFOS-AUTH-AUDIT-0001
- test_id: TEST-MFOS-AUTH-POS-0005
  title: Policy activation increments version and invalidates cache
  test_type: conformance
  status: design
  requirement_ids:
  - MFOS-REQ-AUTH-0008
  - MFOS-REQ-AUTH-0014
  - MFOS-REQ-AUTH-0018
  source_matrix_ids:
  - EXTREF-IBM-ZOS-SYSTEM-INTEGRITY-0001
  - EXTREF-IBM-ZOS-SMF-INTRODUCTION-0001
  preconditions:
  - Staged policy passes policy lint and approvals.
  steps:
  - Run policy transaction lifecycle.
  - Inspect version transition and cache invalidation state.
  expected_result: New active policy_version is committed and prior decision cache
    is invalidated.
  expected_absence:
  - no active policy change without lint
  - no stale allow cache
  audit_expectations:
  - Precommit and commit audit records are required.
  evidence_ids:
  - EV-MFOS-AUTH-LINT-0001
- test_id: TEST-MFOS-AUTH-POS-0006
  title: Emergency access activates with reason expiry audit and incident review
  test_type: conformance
  status: design
  requirement_ids:
  - MFOS-REQ-AUTH-0009
  source_matrix_ids:
  - EXTREF-IBM-ZOS-SECURITY-SERVER-0001
  - EXTREF-IBM-ZOS-SMF-RACF-TYPE-80-0001
  preconditions:
  - Emergency binding permits bounded access and audit is available.
  steps:
  - Request emergency access with reason, expiry, operator identity, and incident
    reference.
  - Verify state transition to emergency context.
  expected_result: Emergency context activates only after required audit and expires
    within policy lifetime.
  expected_absence:
  - no emergency access without reason
  - no audit bypass
  audit_expectations:
  - Break-glass activation, use, close, and review records are required.
  evidence_ids:
  - EV-MFOS-AUTH-AUDIT-0001
- test_id: TEST-MFOS-AUTH-POS-0007
  title: Scoped delegation allows only delegated operation within expiry
  test_type: integration
  status: design
  requirement_ids:
  - MFOS-REQ-AUTH-0016
  source_matrix_ids:
  - EXTREF-IBM-ZOS-RACF-RESOURCE-AUTHORIZATION-0001
  - EXTREF-IBM-ZOS-SMF-INTRODUCTION-0001
  preconditions:
  - Delegator has authority and creates scope-bound delegation.
  steps:
  - Resolve delegation chain.
  - Request delegated operation within scope and expiry.
  expected_result: MFOS_AUTH_ALLOW only for delegated subject, object, operation,
    context, and policy version range.
  expected_absence:
  - no broader authority than delegator
  - no transitive delegation unless explicit
  audit_expectations:
  - Delegation use is auditable.
  evidence_ids:
  - EV-MFOS-AUTH-TESTCAT-0001
- test_id: TEST-MFOS-AUTH-POS-0008
  title: Policy rollback creates a new version without security epoch downgrade
  test_type: conformance
  status: design
  requirement_ids:
  - MFOS-REQ-AUTH-0010
  source_matrix_ids:
  - EXTREF-IBM-ZOS-SYSTEM-INTEGRITY-0001
  - EXTREF-IBM-ZOS-SMF-INTRODUCTION-0001
  preconditions:
  - Rollback target was previously active and passes current lint.
  steps:
  - Authorize rollback.
  - Run rollback transaction.
  expected_result: Rollback commits a new policy_version and preserves or increases
    security_epoch.
  expected_absence:
  - no old version number reuse
  - no audit weakening
  audit_expectations:
  - Rollback precommit and commit records are required.
  evidence_ids:
  - EV-MFOS-AUTH-LINT-0001
- test_id: NEG-MFOS-AUTH-NEG-0001
  title: Unauthorized dataset read denies and creates no handle
  test_type: negative
  status: design
  requirement_ids:
  - MFOS-REQ-AUTH-0004
  - MFOS-REQ-AUTH-0012
  source_matrix_ids:
  - EXTREF-IBM-ZOS-SYSTEM-INTEGRITY-0001
  - EXTREF-IBM-ZOS-DFSMS-CATALOGS-0001
  preconditions:
  - Subject lacks READ binding on dataset object.
  steps:
  - Request dataset READ authorization.
  - Attempt handle creation from denied result.
  expected_result: MFOS_ERR_POLICY_DENIED
  expected_absence:
  - no dataset handle
  - no dataset contents returned
  audit_expectations:
  - Deny audit occurs before final caller result when required by profile.
  evidence_ids:
  - EV-MFOS-AUTH-AUDIT-0001
- test_id: NEG-MFOS-AUTH-NEG-0002
  title: Forged effective principal is rejected
  test_type: negative
  status: design
  requirement_ids:
  - MFOS-REQ-AUTH-0015
  source_matrix_ids:
  - EXTREF-IBM-ZOS-AUTHORIZED-CODE-SCANNER-0001
  - EXTREF-IBM-ZOS-SYSTEM-INTEGRITY-0001
  preconditions:
  - Caller supplies subject fields that conflict with trusted identity binding.
  steps:
  - Submit DecisionRequest with forged effective_principal_ref.
  expected_result: MFOS_ERR_UNAUTHENTICATED
  expected_absence:
  - no authority derived from caller-supplied identity
  audit_expectations:
  - Security-sensitive forged identity attempt is auditable.
  evidence_ids:
  - EV-MFOS-AUTH-TESTCAT-0001
- test_id: NEG-MFOS-AUTH-NEG-0003
