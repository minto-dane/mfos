  - MFOS-REQ-AUTH-0011
  source_matrix_ids:
  - EXTREF-IBM-ZOS-AUTHORIZED-CODE-SCANNER-0001
  - EXTREF-IBM-ZOS-SYSTEM-INTEGRITY-0001
  fuzz:
    target_schema: schemas/mfos/security-decision.schema.yml
    corpus_path: tests/fuzz/corpus/auth/security-decision/
    required_property: malformed decision cannot become allow
  expected_result: Invalid decision payloads fail schema validation or return fail-closed
    decision.
  expected_absence:
