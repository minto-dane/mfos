- test_id: TEST-MFOS-AUTH-SECURITY-DECISION-0101
  title: SecurityDecision allow result validates exact subject object operation context
    and policy version
  test_type: design_positive
  status: planned_design
  target_spec: docs/design/specs/06-authorization.md
  target_requirements:
  - MFOS-REQ-AUTH-0101
  requirement_ids:
  - MFOS-REQ-AUTH-0101
  preconditions:
  - Phase 0.8 semantics freeze artifacts are available.
  - No production or hosted daemon implementation is started.
  input: DecisionRequest for ALICE reading USER.ALICE.INPUT with active policy version
    7 and matching object generation.
  expected_decision: MFOS_AUTH_ALLOW or MFOS_AUTH_ALLOW_WITH_OBLIGATIONS with exact
    subject/object/operation/context/policy_version binding.
  expected_audit: audit obligation is present where the target requirement declares
    one
  expected_failure_mode: none_for_positive_case
  evidence_required:
  - test_result
  - traceability_link
  - red_team_review_record
  phase_to_implement: Phase 0.9 or later
  expected_result: MFOS_AUTH_ALLOW or MFOS_AUTH_ALLOW_WITH_OBLIGATIONS with exact
    subject/object/operation/context/policy_version binding.
  coverage_note: Concrete Phase 0.8 planned semantic test.
