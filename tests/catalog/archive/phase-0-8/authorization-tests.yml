  steps:
  - Request undefined operation on protected resource.
  expected_result: MFOS_ERR_SPEC_GAP
  expected_absence:
  - no fallback allow
  - no protected effect
  audit_expectations:
  - Spec-gap decision is auditable when it reaches a protected interface.
  evidence_ids:
  - EV-MFOS-AUTH-GAP-0001
- test_id: NEG-MFOS-AUTH-NEG-0004
