evidence_requirements:
- evidence_id: EV-MFOS-CATALOG-TX-0002
  required_artifact: artifacts/tests/catalog/phase-0-8/catalog-transaction-report.json
  must_show:
  - committed entries resolve
  - uncommitted entries do not resolve
  - rolled-back entries do not resolve
  - partial journal entries do not resolve
  - integrity-failed entries do not resolve
- evidence_id: EV-MFOS-CATALOG-CRASH-0002
  required_artifact: artifacts/tests/catalog/phase-0-8/crash-recovery-report.json
  must_show:
  - old committed entry or new fully committed entry after crash
  - no partial success after torn journal
  - recovery audit evidence for affected DSNs
- evidence_id: EV-MFOS-DATASET-HANDLE-0001
  required_artifact: artifacts/tests/catalog/phase-0-8/dataset-handle-report.json
  must_show:
  - subject binding
  - operation binding
  - policy_version binding
  - catalog_entry_generation binding
  - dataset_generation binding
  - expiry binding
  - ObjectGenerationBinding validation
- evidence_id: EV-MFOS-DATASET-NO-HANDLE-0002
  required_artifact: artifacts/tests/catalog/phase-0-8/deny-no-handle-report.json
  must_show:
  - no active handle after DENY
  - no cached handle after DENY
  - no deferred handle after DENY
  - deny audit exists before final caller denial
- evidence_id: EV-MFOS-DATASET-AUD-ORDER-0006
  required_artifact: artifacts/tests/catalog/phase-0-8/audit-ordering-report.json
  must_show:
  - DATASET_OPEN_DENY audit append acceptance precedes caller result
  - audit failure returns MFOS_ERR_AUDIT_REQUIRED_BUT_UNAVAILABLE
  - no handle is created during audit failure
entries:
- test_id: TEST-MFOS-CATALOG-DSN-0001
  title: Phase 0.8 DSN grammar accepts canonical uppercase qualifiers
  test_type: unit
  requirement_ids:
  - MFOS-REQ-CATALOG-0001
  source_matrix_ids:
  - EXTREF-IBM-ZOS-DFSMS-CATALOGS-0001
  preconditions:
  - DSN parser uses Phase 0.8 grammar.
  steps:
  - Validate USER.ALICE.INPUT.
  - Validate SYS.CATALOG.
  - Validate TEMP.JOB_01.OUT-1.
  expected_result: Accepted DSNs canonicalize to identical uppercase DSNs with no
    catalog mutation.
  expected_absence:
  - no POSIX path interpretation
  - no catalog entry creation during parse-only validation
  evidence_ids: []
- test_id: NEG-MFOS-CATALOG-DSN-0001
  title: Phase 0.8 DSN grammar rejects paths and malformed qualifiers
  test_type: negative
  requirement_ids:
  - MFOS-REQ-CATALOG-0001
  source_matrix_ids:
  - EXTREF-IBM-ZOS-DFSMS-CATALOGS-0001
  steps:
  - Validate USER/ALICE/INPUT.
  - Validate .USER.ALICE.
  - Validate USER..ALICE.
  - Validate USER.ALICE.INPUT.TOOLONGQUAL.
  - Validate user.alice.input at the catalogd boundary.
  expected_result: MFOS_ERR_INVALID_DSN
  expected_absence:
  - no catalog lookup
  - no journal write
  - no dataset handle
  evidence_ids: []
- test_id: TEST-MFOS-CATALOG-COMMITTED-0002
  title: Committed catalog entry resolves
  test_type: integration
  requirement_ids:
  - MFOS-REQ-CATALOG-0002
  source_matrix_ids:
  - EXTREF-IBM-ZOS-DFSMS-CATALOGS-0001
  - EXTREF-IBM-ZOS-DFSMS-LIBRARY-0001
  preconditions:
  - USER.ALICE.INPUT has a COMMITTED CatalogEntry.
  - integrity_tag verifies.
  steps:
  - Resolve USER.ALICE.INPUT through catalogd.
  expected_result: catalogd returns entry_id, dataset_id, generation, location reference,
    and integrity tag.
  expected_absence:
  - no raw volume handle
  - no POSIX path returned
  evidence_ids:
  - EV-MFOS-CATALOG-TX-0002
- test_id: NEG-MFOS-CATALOG-UNCOMMITTED-0002
  title: Uncommitted catalog entry does not resolve
  test_type: negative
  requirement_ids:
  - MFOS-REQ-CATALOG-0002
  source_matrix_ids:
  - EXTREF-IBM-ZOS-DFSMS-CATALOGS-0001
  preconditions:
  - USER.ALICE.PREPARED exists only as PREPARED.
  steps:
  - Resolve USER.ALICE.PREPARED.
  expected_result: MFOS_ERR_CATALOG_NOT_FOUND
  expected_absence:
  - no CatalogEntry returned
  - no DatasetHandle returned
  evidence_ids:
  - EV-MFOS-CATALOG-TX-0002
- test_id: NEG-MFOS-CATALOG-ROLLED-BACK-0002
  title: Rolled-back catalog entry does not resolve
  test_type: crash_recovery
  requirement_ids:
  - MFOS-REQ-CATALOG-0002
  source_matrix_ids:
  - EXTREF-IBM-ZOS-DFSMS-CATALOGS-0001
  steps:
  - Replay a transaction with rollback marker for USER.ALICE.ROLLBACK.
  - Resolve USER.ALICE.ROLLBACK after recovery.
  expected_result: MFOS_ERR_CATALOG_NOT_FOUND
  expected_absence:
  - no resurrected entry
  - no dataset handle
  evidence_ids:
  - EV-MFOS-CATALOG-CRASH-0002
- test_id: NEG-MFOS-CATALOG-PARTIAL-JOURNAL-0002
  title: Partially journaled catalog entry fails closed
  test_type: crash_recovery
  requirement_ids:
  - MFOS-REQ-CATALOG-0002
  source_matrix_ids:
  - EXTREF-IBM-ZOS-DFSMS-CATALOGS-0001
  - EXTREF-IBM-ZOS-SMF-INTRODUCTION-0001
  steps:
  - Replay a torn journal entry for USER.ALICE.PARTIAL.
  - Run catalog recovery.
  - Attempt resolve.
  expected_result: MFOS_ERR_INTERNAL_CORRUPTION or MFOS_ERR_CATALOG_NOT_FOUND
  expected_absence:
  - no partial entry visible
  - no successful open
  audit_expectations:
  - CATALOG_RECOVERY records affected DSN and recovery action.
  evidence_ids:
  - EV-MFOS-CATALOG-CRASH-0002
- test_id: NEG-MFOS-CATALOG-INTEGRITY-TAG-0002
  title: Catalog integrity tag mismatch fails closed
  test_type: fault_injection
  requirement_ids:
  - MFOS-REQ-CATALOG-0002
  - MFOS-REQ-CATALOG-0008
  source_matrix_ids:
  - EXTREF-IBM-ZOS-DFSMS-CATALOGS-0001
  - EXTREF-IBM-ZOS-SMF-INTRODUCTION-0001
  steps:
  - Corrupt a committed CatalogEntry payload without updating integrity_tag.
  - Attempt resolve and dataset open.
  expected_result: MFOS_ERR_INTERNAL_CORRUPTION
  expected_absence:
  - no committed resolve result
  - no dataset handle
  audit_expectations:
  - DATASET_INTEGRITY_FAILURE or CATALOG_RECOVERY evidence is emitted.
  evidence_ids:
  - EV-MFOS-CATALOG-TX-0002
  - EV-MFOS-CATALOG-CRASH-0002
- test_id: NEG-MFOS-CATALOG-IMMUTABLE-SYS-0004
  title: Committed system dataset cannot be mutated
  test_type: negative
  requirement_ids:
  - MFOS-REQ-CATALOG-0004
  source_matrix_ids:
  - EXTREF-IBM-ZOS-DFSMS-CATALOGS-0001
  - EXTREF-IBM-ZOS-RACF-RESOURCE-AUTHORIZATION-0001
  preconditions:
  - SYS.CATALOG is COMMITTED with system_dataset true and immutable true.
  steps:
  - Attempt to unset immutable.
  - Attempt to update owner.
  - Attempt to delete SYS.CATALOG through ordinary catalog update path.
  expected_result: MFOS_ERR_IMMUTABLE
  expected_absence:
  - no generation increment
  - no metadata mutation
  audit_expectations:
  - DATASET_IMMUTABLE_DENY includes DSN, subject, requested_action, and policy_version.
  evidence_ids: []
- test_id: TEST-MFOS-DATASET-HANDLE-0001
  title: Authorized open creates a bound DatasetHandle
  test_type: integration
  requirement_ids:
  - MFOS-REQ-DATASET-0001
  source_matrix_ids:
  - EXTREF-IBM-ZOS-DFSMS-CATALOGS-0001
  - EXTREF-IBM-ZOS-RACF-RESOURCE-AUTHORIZATION-0001
  preconditions:
  - USER.ALICE.INPUT is committed and integrity-verified.
  - securityd allows ALICE READ.
  - auditd accepts required audit obligation.
  steps:
  - Open USER.ALICE.INPUT for READ as ALICE.
  - Inspect DatasetHandle.
  expected_result: ACTIVE handle binds subject, operation, policy_version, catalog_entry_generation,
    dataset_generation, expiry, correlation_id, and ObjectGenerationBinding.
  expected_absence:
  - no POSIX file descriptor semantics
  - no caller-supplied generation authority
  evidence_ids:
  - EV-MFOS-DATASET-HANDLE-0001
- test_id: NEG-MFOS-DATASET-DENY-NO-HANDLE-0002
  title: Authorization DENY creates no handle
  test_type: negative
  requirement_ids:
  - MFOS-REQ-DATASET-0002
  - MFOS-REQ-DATASET-0006
  source_matrix_ids:
  - EXTREF-IBM-ZOS-RACF-RESOURCE-AUTHORIZATION-0001
  - EXTREF-IBM-ZOS-SMF-RACF-TYPE-80-0001
  preconditions:
  - securityd denies BOB READ on USER.ALICE.INPUT.
  - auditd is available.
  steps:
  - Open USER.ALICE.INPUT for READ as BOB.
  expected_result: MFOS_ERR_POLICY_DENIED
  expected_absence:
  - no ACTIVE handle
  - no cached handle
  - no deferred handle
  - no dataset content returned
  audit_expectations:
  - DATASET_OPEN_DENY is durable before caller receives denial.
  evidence_ids:
  - EV-MFOS-DATASET-NO-HANDLE-0002
  - EV-MFOS-DATASET-AUD-ORDER-0006
- test_id: NEG-MFOS-DATASET-STALE-HANDLE-0001
  title: Stale generation binding rejects handle use
  test_type: negative
  requirement_ids:
  - MFOS-REQ-DATASET-0001
  source_matrix_ids:
  - EXTREF-IBM-ZOS-DFSMS-CATALOGS-0001
  - EXTREF-IBM-ZOS-RACF-RESOURCE-AUTHORIZATION-0001
  steps:
  - Create a valid handle for USER.ALICE.INPUT.
  - Commit a catalog generation update.
  - Attempt to use the old handle.
  expected_result: MFOS_ERR_STALE_HANDLE
  expected_absence:
  - no read or write through stale handle
  audit_expectations:
  - DATASET_HANDLE_REJECT records stale generation.
  evidence_ids:
  - EV-MFOS-DATASET-HANDLE-0001
- test_id: NEG-MFOS-DATASET-BYPASS-0001
  title: Raw volume and POSIX path bypass attempts are rejected
  test_type: negative
  requirement_ids:
  - MFOS-REQ-CATALOG-0002
  - MFOS-REQ-DATASET-0005
  source_matrix_ids:
  - EXTREF-IBM-ZOS-DFSMS-CATALOGS-0001
  - EXTREF-IBM-ZOS-RACF-RESOURCE-AUTHORIZATION-0001
  steps:
  - Attempt open by raw volume reference.
  - Attempt open by host POSIX path.
  - Attempt open by inode-like token.
  expected_result: MFOS_ERR_INVALID_PARAMETER or MFOS_ERR_POLICY_DENIED
  expected_absence:
  - no catalog bypass
  - no dataset handle
  - no file wrapper success
  evidence_ids: []
- test_id: TEST-MFOS-DATASET-RETENTION-0003
  title: Expired temporary dataset deletion succeeds with audit
  test_type: integration
  requirement_ids:
  - MFOS-REQ-DATASET-0003
  source_matrix_ids:
  - EXTREF-IBM-ZOS-DFSMS-LIBRARY-0001
  - EXTREF-IBM-ZOS-SMF-INTRODUCTION-0001
  preconditions:
  - TEMP.JOB01.OUT has expired retention.
  - securityd allows DELETE.
  steps:
  - Delete TEMP.JOB01.OUT.
  expected_result: Dataset reaches DELETED or tombstoned state according to secure
    deletion policy.
  expected_absence:
  - no deletion without audit record
  audit_expectations:
  - DATASET_DELETE_REQUEST and DATASET_CLOSE or deletion result are linked by correlation_id.
  evidence_ids: []
- test_id: NEG-MFOS-DATASET-RETENTION-0003
  title: Active retention policy blocks deletion
  test_type: negative
  requirement_ids:
  - MFOS-REQ-DATASET-0003
  source_matrix_ids:
  - EXTREF-IBM-ZOS-DFSMS-LIBRARY-0001
  - EXTREF-IBM-ZOS-SMF-INTRODUCTION-0001
  steps:
  - Attempt to delete USER.ALICE.RETAINED before retain_until_utc.
  expected_result: MFOS_ERR_RETENTION_DENIED
  expected_absence:
  - no deleted state
  - no secure deletion attempt
  audit_expectations:
  - DATASET_RETENTION_BLOCK records retention policy and requested action.
  evidence_ids: []
- test_id: NEG-MFOS-DATASET-ENCRYPTION-PLACEHOLDER-0004
  title: Required placeholder encryption does not silently downgrade
  test_type: negative
  requirement_ids:
  - MFOS-REQ-DATASET-0004
  source_matrix_ids:
  - EXTREF-IBM-ZOS-DFSMS-LIBRARY-0001
  - EXTREF-IBM-ZOS-RACF-RESOURCE-AUTHORIZATION-0001
  preconditions:
  - CatalogEntry encryption_policy.mode is KEY_SERVICE_PLACEHOLDER.
  - Operation requires configured encryption.
  steps:
  - Open USER.ALICE.SECRET for READ.
  expected_result: MFOS_ERR_ENCRYPTION_POLICY_UNAVAILABLE or MFOS_ERR_SPEC_GAP
  expected_absence:
  - no unencrypted fallback
  - no handle
  - no fake success
  evidence_ids: []
- test_id: TEST-MFOS-DATASET-DENY-AUDIT-0006
  title: Dataset open denial audit precedes caller denial
  test_type: integration
  requirement_ids:
  - MFOS-REQ-DATASET-0006
  source_matrix_ids:
  - EXTREF-IBM-ZOS-SMF-INTRODUCTION-0001
  - EXTREF-IBM-ZOS-SMF-RACF-TYPE-80-0001
  steps:
  - Trigger denied open.
  - Capture audit append acceptance sequence.
  - Capture caller denial sequence.
  expected_result: Audit append acceptance precedes caller result.
  expected_absence:
  - no caller-visible denial before audit acceptance
  evidence_ids:
  - EV-MFOS-DATASET-AUD-ORDER-0006
- test_id: NEG-MFOS-DATASET-DENY-WITHOUT-AUDIT-0006
  title: Dataset open denial fails closed when audit is unavailable
  test_type: fault_injection
  requirement_ids:
  - MFOS-REQ-DATASET-0006
  source_matrix_ids:
  - EXTREF-IBM-ZOS-SMF-INTRODUCTION-0001
  - EXTREF-IBM-ZOS-SMF-RACF-TYPE-80-0001
  steps:
  - Make auditd unavailable.
  - Trigger denied open.
  expected_result: MFOS_ERR_AUDIT_REQUIRED_BUT_UNAVAILABLE
  expected_absence:
  - no handle
  - no diagnostic log counted as audit evidence
  evidence_ids:
  - EV-MFOS-DATASET-AUD-ORDER-0006
- test_id: TEST-MFOS-DATASET-SCHEMA-0003
