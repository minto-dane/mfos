compatibility_statement: MFOS is independently specified, does not claim compatibility with external products, and must not reproduce external record layouts, command syntax, macro interfaces, documentation, or other protected source material.
global_rules:
  canonical_ledger: Source cards under docs/design/source-matrix/cards/*.yml are the machine-readable source-card ledger for v0.5.
  legacy_input: docs/design/source-matrix/source-matrix.yaml is retained as conversion history; v0.5 downstream references should use source-matrix.yml and cards/*.yml.
  source_types:
  - external_reference
  - internal_transfer
  prohibited_claims:
  - z/OS compatibility
  - JES compatibility
  - RACF compatibility
  - DFSMS compatibility
  - APF compatibility
  - PR/SM compatibility
  - Windows VBS compatibility
  ledger_rules:
  - Every z/OS-inspired MFOS concept must cite at least one Source Matrix ID.
  - Every IBM-derived term used as an MFOS term must document semantic overlap and MFOS divergence.
  - Specified but unimplemented behavior must fail closed as UNSUPPORTED.
  - Unspecified behavior must be marked SPEC_GAP and must not be implemented as success.
  - PXM must not interpret MFOS job, dataset, catalog, spool, security, or workload policy semantics.
  - Guard must stay limited to selected High-Assurance root objects.
  card_required_fields:
  - source_id
  - source_kind
  - source_type
  - semantic_role
  - vendor
  - document_title
  - document_url
  - retrieved_at
  - review_topics
  - mfos_mapping
  - mfos_divergence
  - prohibited_inference
  - legal_controls
  - source_refs
  - requirement_refs
  - review_status
