registry_kind: cpu_feature_registry
schema_version: 1
registry_id: MFOS-REG-CPU-FEATURES-0001
status: draft
generated_from:
- path: docs/design/specs/44-architecture-portability-policy.md
- path: docs/design/specs/45-x86-64-target-profiles.md
updated_at_utc: '2026-04-30T00:00:00Z'
updated_by: codex
non_compatibility_statement: MFOS is x86-64-first for initial implementation planning, not x86-64-only, and does not claim Hyper-V, KVM, Intel, AMD, Linux, Rust, glibc, GCC, or seL4 compatibility.
source_matrix_ref:
  path: docs/design/source-matrix/source-matrix.yml
  schema_version: 1
schema_ref:
  path: schemas/mfos/cpu-feature-profile.schema.yml
implementation_allowed: false
design_only: true
registry_rules:
- This registry is a design-time identity, evidence, and policy registry; it is not a CPU feature detector.
- CPU feature presence does not define MFOS enterprise semantics.
- Optional CPU features are available only through selected profile requirements and capability evidence.
- A feature status of planned, required, optional, forbidden_in_baseline, future, or deprecated is not an implementation or validation claim.
constants:
  tcb_v4_forbidden_components: &tcb_v4_forbidden
  - PXM_CORE
  - PXM_GUARD
  - NUCLEUS_ENTRY_EXIT
  - INTERRUPT_TRAP
  - CONTEXT_SWITCH
  - VMX_SVM_BOUNDARY
