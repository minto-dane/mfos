  optional_features: [X64_FEATURE_SMEP, X64_FEATURE_SMAP]
  forbidden_features: [X64_PROFILE_X86_64_V4, X64_FEATURE_X86_64_V4, X64_FEATURE_AVX512_CLASS, X64_FEATURE_INTEL_TDX, X64_FEATURE_AMD_SEV, X64_FEATURE_AMD_SEV_ES, X64_FEATURE_AMD_SEV_SNP, X64_FEATURE_AMD_SEV_TIO, X64_FEATURE_INTEL_SGX, X64_FEATURE_INTEL_SGX_DCAP_ATTESTATION, X64_FEATURE_INTEL_SGX_EPID_ATTESTATION]
