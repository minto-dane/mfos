registry_kind: cpu_target_profiles
schema_version: 1
registry_id: MFOS-REG-CPU-TARGET-PROFILES-0001
status: draft
generated_from:
- path: docs/design/specs/44-architecture-portability-policy.md
- path: docs/design/specs/45-x86-64-target-profiles.md
updated_at_utc: '2026-04-30T00:00:00Z'
updated_by: codex
non_compatibility_statement: MFOS CPU target profiles are independent design profiles and do not claim Hyper-V, KVM, Intel, AMD, Linux, glibc, GCC, Rust, or seL4 compatibility.
source_matrix_ref:
  path: docs/design/source-matrix/source-matrix.yml
  schema_version: 1
schema_ref:
  path: schemas/mfos/cpu-feature-profile.schema.yml
implementation_allowed: false
design_only: true
registry_rules:
- A profile cannot reference a feature_id missing from docs/design/registries/cpu-feature-registry.yml.
- MFOS-X64-BASELINE cannot require x86-64-v4, Intel TDX, AMD SEV-SNP, or Intel SGX.
- MFOS-X64-V4-PERFORMANCE cannot imply TDX, SEV, SGX, CET, CFI, or CVM support.
- CVM profiles cannot imply x86-64-v4 performance support.
- MFOS-X64-TEE-INTEL-SGX is enclave/TEE only and cannot be classified as a CVM profile.
