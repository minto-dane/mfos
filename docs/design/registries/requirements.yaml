- requirement_id: MFOS-REQ-SYSINT-0005
  title: Baseline excludes post-nucleus and post-authorized-module compromise protection
  normative_text: 'Baseline system integrity MUST NOT claim selected root-object protection
    after nucleus compromise, authorized service compromise, or malicious signed AMF
    module compromise. Such claims require High-Assurance Guard requirements and evidence.

    '
