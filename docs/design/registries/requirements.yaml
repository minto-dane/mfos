schema_ref:
  path: docs/design/registries/requirements-schema.md
source_matrix_ref:
  path: docs/design/source-matrix/source-matrix.yml
  schema_version: 1
non_compatibility_statement: MFOS is z/OS-inspired and does not claim z/OS compatibility
  or IBM product compatibility.
language_policy:
  canonical_language: en
  machine_readable_keys_language: en
  japanese_status: explanatory_mirror_only
  conflict_rule: If this English catalog conflicts with Japanese commentary, this
    English catalog wins until a reviewed bilingual parity process updates both.
profile_model:
  profiles:
    baseline:
      description: Single MFOS partition profile. NX-capable platform and W^X policy
        are required. PXM partition claims are not allowed.
    enterprise_standalone:
      description: Enterprise profile without PXM partitioning. Secure/measured boot,
        TPM, audit/export, and platform DMA protection may be required, but cross-partition
        or device-assignment claims are not allowed.
    enterprise_pxm:
      description: Enterprise profile with PXM. Partition lifecycle, side-partition,
        and device-assignment claims are allowed only where PXM requirements and teardown
        evidence exist.
    high_assurance:
      description: PXM plus Guard profile for selected root-object protection and
        higher evidence obligations.
  applicability_values:
  - required
  - conditional
  - optional
  - not_applicable
  - prohibited
  - deferred
source_type_values:
- normative
- informative
- internal_transfer
- external_reference
status_values:
- draft
- reviewed
- approved
- superseded
entries:
- requirement_id: MFOS-REQ-PROFILE-0001
  title: Enterprise profile split
  normative_text: 'MFOS MUST split the previous Enterprise profile into Enterprise-Standalone
    and Enterprise-PXM. Enterprise-Standalone MUST NOT claim partition lifecycle,
    side-partition isolation, or passthrough device-assignment properties. Enterprise-PXM
    MAY claim those properties only when PXM requirements and evidence are satisfied.

    '
  source_refs:
  - source_id: FBVBS-001
    source_type: internal_transfer
    role: profile_discipline
  - source_id: NIST-160-001
    source_type: normative
    role: assurance_claim_scoping
  - source_id: EXTREF-IBM-Z-LPAR-INTRODUCTION-0001
    source_type: external_reference
    role: partition_concept_root
  profile_applicability:
    baseline: required
    enterprise_standalone: required
    enterprise_pxm: required
    high_assurance: required
  target_components:
  - conformance
  - architecture
  - release-review
  - ci-profile-lint
  verification:
    primary:
    - conformance_review
    - profile_lint
    tests:
      positive:
      - TEST-MFOS-PROFILE-0001
      negative:
      - NEG-MFOS-PROFILE-0001
      - NEG-MFOS-PROFILE-0002
  audit_obligation:
    obligation: conditional
    record_type: RELEASE_CLAIM_REVIEW
    before_return: false
    redaction_policy: NONE
    notes: Required for release or conformance-claim publication, not for ordinary
      runtime operations.
  failure_mode:
    error: CONFORMANCE_CLAIM_REJECTED
    fail_closed: true
    conditions:
    - Enterprise-Standalone attempts to claim PXM partition lifecycle or side-partition
      isolation.
    - Enterprise-PXM claim lacks PXM requirement evidence.
  evidence_required:
  - evidence_type: conformance_matrix
    evidence_id: EV-MFOS-PROFILE-0001
  - evidence_type: release_review_record
    evidence_id: EV-MFOS-PROFILE-0002
  - evidence_type: profile_lint_result
    evidence_id: EV-MFOS-PROFILE-0003
  status: draft
  legacy_requirement_ids:
  - MFOS-REQ-PROF-0001
- requirement_id: MFOS-REQ-NUCLEUS-0008
  title: Baseline NX and W^X enforcement
  normative_text: 'MFOS Baseline conformance requires an NX-capable platform and a
    nucleus W^X policy. Baseline conformance MUST NOT be claimed if NX is unavailable,
    disabled, or not enforceable by the nucleus. The nucleus MUST NOT map writable
    executable pages.

    '
  source_refs:
  - source_id: X64-INTEL-001
    source_type: normative
    role: x64_memory_protection_root
  - source_id: X64-AMD-001
    source_type: normative
    role: amd64_memory_protection_root
  - source_id: EXTREF-IBM-ZOS-SYSTEM-INTEGRITY-0001
    source_type: external_reference
    role: system_integrity_semantic_root
  - source_id: FBVBS-001
    source_type: internal_transfer
    role: no_fake_success_profile_gate
  profile_applicability:
    baseline: required
    enterprise_standalone: required
    enterprise_pxm: required
    high_assurance: required
  target_components:
  - nucleus
  - boot
  - page-table-manager
  - ci-platform-lint
  verification:
    primary:
    - platform_feature_test
    - mapping_negative_test
    - boot_test
    tests:
      positive:
      - TEST-MFOS-NUCLEUS-0008
      negative:
      - NEG-MFOS-NUCLEUS-WX-0001
      - NEG-MFOS-NUCLEUS-NX-0001
  audit_obligation:
    obligation: conditional
    record_type: BOOT_PLATFORM_POLICY_DENY
    before_return: true
    redaction_policy: PLATFORM_FEATURES_ONLY
    notes: If auditd is unavailable during early boot, the denial must be captured
      in boot evidence or recovery-mode evidence.
  failure_mode:
    error: MFOS_ERR_PLATFORM_REQUIREMENT_UNMET
    fail_closed: true
    conditions:
    - NX is unavailable, disabled, or not enforceable.
    - A mapping request would create a writable executable page.
  evidence_required:
  - evidence_type: platform_feature_report
    evidence_id: EV-MFOS-NUCLEUS-NX-0001
  - evidence_type: mapping_test_result
    evidence_id: EV-MFOS-NUCLEUS-WX-0001
  - evidence_type: boot_denial_record
    evidence_id: EV-MFOS-NUCLEUS-BOOT-0001
  status: draft
  legacy_requirement_ids:
  - MFOS-REQ-NUC-0008
- requirement_id: MFOS-REQ-SYSINT-0001
  title: Unauthorized subjects cannot bypass protected resources through system interfaces
  normative_text: 'Unauthorized subjects MUST NOT bypass security policy, dataset
    access, catalog metadata, audit recording, spool access, job identity, operator
    command authority, authorized execution state, or system control objects through
    defined MFOS system interfaces.

    '
  source_refs:
