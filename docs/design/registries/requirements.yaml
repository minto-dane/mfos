- requirement_id: MFOS-REQ-AI-0005
  title: AI-generated production paths cannot use fake success
  normative_text: 'AI-generated production paths MUST NOT use fake success, empty stubs, or silent fallback. Specified but unimplemented behavior MUST fail closed with MFOS_ERR_UNSUPPORTED, and unspecified behavior MUST fail closed with MFOS_ERR_SPEC_GAP.

    '
