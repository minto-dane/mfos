- requirement_id: MFOS-REQ-SYSINT-0004
  title: Authorized state is ExecutionState plus AuthorityClass
  normative_text: 'Authorized state MUST be modeled as ExecutionState plus AuthorityClass. MFOS MUST NOT collapse authorized state into a single root, administrator, UID, or AMF bit.

    '
  source_refs:
