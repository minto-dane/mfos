    - negative_test
    - no_fake_success_ci
    tests:
      positive:
      - TEST-MFOS-AMF-DISABLED-QUERY-0021
      negative:
      - NEG-MFOS-AMF-LOAD-DISABLED-0021
      - NEG-MFOS-AMF-RX-MAPPING-DISABLED-0021
      - NEG-MFOS-AMF-REGISTRY-DISABLED-0021
  audit_obligation:
    obligation: required
    record_type: AMF_LOAD_UNSUPPORTED
    before_return: true
    redaction_policy: MODULE_ID_VISIBLE_DIGEST_VISIBLE
    notes: AMF load attempts are security-sensitive even when disabled.
  failure_mode:
    error: MFOS_ERR_UNSUPPORTED
    fail_closed: true
    conditions:
