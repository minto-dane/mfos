  title: Supervisor paths do not directly dereference untrusted pointers
  normative_text: 'Supervisor code MUST NOT directly dereference untrusted user pointers. User buffers MUST be validated and copied through typed copy-in/copy-out routines before supervisor or trusted-service use.

    '
