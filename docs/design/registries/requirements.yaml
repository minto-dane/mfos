  title: PXM device assignment requires IOMMU and interrupt remapping
  normative_text: 'PXM device assignment MUST require IOMMU domain setup and interrupt remapping before passthrough device ownership is granted to a partition. Enterprise-Standalone MUST NOT claim PXM passthrough device assignment.

