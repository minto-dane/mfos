- requirement_id: MFOS-REQ-SYSINT-0002
  title: System interface list is fixed before implementation
  normative_text: 'The MFOS system interface list MUST be fixed in specification before
    any production implementation can rely on it. New system interfaces MUST be added
    through reviewed specification updates, Source Matrix references, failure modes,
    audit obligations, and negative tests.

    '
