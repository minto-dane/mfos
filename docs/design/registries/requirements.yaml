  title: High-Assurance root protection requires Guard evidence
  normative_text: 'High-Assurance root-object protection claims MUST bind to explicit
    PXM Guard root objects, Guard transition evidence, measured-boot context, and
    attestation evidence. Claims without Guard evidence MUST be rejected.

    '
