  title: Core system interfaces are enumerated and protected
  normative_text: 'SVC, PCALL, operator command, dataset open, catalog transaction, job submit, spool browse/purge, AMF load, update activation, PXM_CALL, and GUARD_CALL MUST be treated as MFOS system interfaces.

    '
