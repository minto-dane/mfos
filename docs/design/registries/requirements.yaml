  - generated-code-review
  - release-review
  verification:
    primary:
    - ci_lint
    - code_review
    - negative_test
    tests:
      positive:
      - TEST-MFOS-AI-UNSUPPORTED-0005
      negative:
      - NEG-MFOS-AI-FAKE-SUCCESS-0005
      - NEG-MFOS-AI-SILENT-FALLBACK-0005
      - NEG-MFOS-AI-SPEC-GAP-SUCCESS-0005
  audit_obligation:
    obligation: conditional
