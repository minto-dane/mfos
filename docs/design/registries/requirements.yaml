  - spec-front-matter
  - svc-pcall
  - ci-source-grounding
  verification:
    primary:
    - architecture_inspection
    - source_grounding_lint
    tests:
      positive:
      - TEST-MFOS-SYSINT-INTERFACE-REGISTRY-0002
      negative:
      - NEG-MFOS-SYSINT-UNREGISTERED-INTERFACE-0002
  audit_obligation:
    obligation: conditional
    record_type: DESIGN_GATE_REVIEW
    before_return: false
    redaction_policy: NONE
    notes: Runtime audit is owned by each registered interface; this requirement gates design changes.
  failure_mode:
    error: SPEC_GAP_REPORT_REQUIRED
    fail_closed: true
    conditions:
    - A proposed implementation references a system interface absent from the approved spec.
    - A new interface lacks Source Matrix refs, audit obligations, or negative tests.
