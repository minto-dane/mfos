name: MFOS Design Validation

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - phase/**
  workflow_dispatch:

jobs:
  validate-design:
    name: validate design registries and lint gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Run release-mode design validation
        run: ./scripts/validate-all.sh --check
