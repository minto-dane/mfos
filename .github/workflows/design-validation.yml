name: MFOS Design Validation

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - phase/**
  workflow_dispatch:

jobs:
  validate-design:
    name: validate design registries and lint gates
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Install pinned Dafny
        run: |
          ./scripts/install-dafny.sh
          echo "$PWD/.tools/dafny/4.11.0/dafny" >> "$GITHUB_PATH"

      - name: Run draft check-mode design validation
        run: ./scripts/validate-all.sh --check

      - name: Run component scaffold metadata validation
        run: ./scripts/validate-component-scaffold.sh

      - name: Run Dafny executable semantics scaffold validation
        run: ./scripts/validate-dafny-semantics-scaffold.sh

      - name: Run Dafny executable semantics validation
        run: ./scripts/validate-dafny-semantics.sh --require-dafny

      - name: Run Phase 1 red-team validation
        run: python3 scripts/checks/check-phase1-red-team.py --mode draft
