name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - phase/**
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:

jobs:
  analyze:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - python

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Record private repository CodeQL limitation
        if: ${{ github.event.repository.private && vars.MFOS_ENABLE_PRIVATE_CODEQL != 'true' }}
        run: |
          echo "CodeQL upload is skipped for this private repository because code scanning is not enabled."
          echo "Set repository variable MFOS_ENABLE_PRIVATE_CODEQL=true after GitHub Advanced Security/code scanning is available."

      - name: Initialize CodeQL
        if: ${{ !github.event.repository.private || vars.MFOS_ENABLE_PRIVATE_CODEQL == 'true' }}
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        if: ${{ !github.event.repository.private || vars.MFOS_ENABLE_PRIVATE_CODEQL == 'true' }}
        uses: github/codeql-action/analyze@v4
