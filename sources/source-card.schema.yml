schema_kind: source_card_shape
schema_version: 3
canonical_current: docs/design/source-matrix/source-card-schema.md
authority_status: preparatory_until_adr_migration
json_schema: schemas/source-card.schema.json
required_fields:
  - source_id
  - source_kind
  - source_type
  - semantic_role
  - vendor
  - document_title
  - document_url
  - retrieved_at
  - reference_purpose
  - review_topics
  - mfos_mapping
  - mfos_divergence
  - prohibited_inference
  - legal_controls
  - source_refs
  - requirement_refs
  - review_status
public_safe_required_fields:
  - authority_status
  - citation_scope
  - retrieval_metadata
  - cache_disposition
  - legal_controls
  - prohibited_inference
retrieval_metadata_fields:
  - retrieved_at
  - retrieved_by
  - public_url
  - landing_page_url
  - source_version
  - section_scope
  - local_cache_manifest
cache_disposition_values:
  - no_local_cache
  - local_manifest_only
  - temporary_ignored_cache
  - purged_after_review
allowed_source_types:
  - external_reference
  - internal_transfer
allowed_authority_statuses:
  - canonical_in_docs_design_source_matrix
  - preparatory_until_adr_migration
  - migrated_canonical_after_adr
removed_public_fields:
  - canonical_concepts
  - normative_source
  - detailed_summary
  - source_summary
  - copied_excerpt
  - record_layouts
  - command_syntax
  - macro_signatures
prohibited_committed_content:
  - external_pdf
  - html_mirror
  - epub
  - screenshot
  - copied_table
  - copied_diagram
  - copied_record_layout
  - copied_command_reference
  - copied_macro_signature
  - detailed_source_substitute_summary
legal_controls_required_flags:
  - trademark_reference_only
  - no_affiliation_claim
  - no_compatibility_claim
  - no_conformance_claim
  - no_certification_claim
  - no_source_substitution
