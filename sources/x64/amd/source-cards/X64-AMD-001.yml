  mapping_notes:
  - Use AMD64 mechanisms as implementation enforcement aids for MFOS-owned abstractions.
  - Keep SVM and NPT mappings subordinate to MFOS partition and Guard policy.
mfos_divergence:
- AMD64 mechanisms are enforcement aids and must be tied to MFOS abstractions and
  profile requirements.
- MFOS does not derive authorization policy directly from AMD64 feature bits.
prohibited_inference:
- AMD64 features provide compatibility with any external operating system.
- SVM or NPT alone proves MFOS partition isolation.
- Do not treat this card as a substitute for the AMD manual.
