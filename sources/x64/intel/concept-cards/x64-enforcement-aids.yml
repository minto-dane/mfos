  - TEST-NUC-WX-MAPPING-DENY-001
  - TEST-PXM-EPT-POLICY-DENY-001
  - TEST-CET-AUTHORIZATION-CLAIM-LINT-001
  - TEST-PKU-INSTRUCTION-FETCH-CLAIM-LINT-001
legal_controls:
  public_safe: true
  no_copied_text: true
  no_external_compatibility_claims: true
