  mapping_notes:
  - Use Intel mechanisms as implementation enforcement aids for MFOS-owned abstractions.
  - Do not derive enterprise authorization or audit policy directly from CPU features.
mfos_divergence:
- MFOS policy roots are MFOS requirements and assurance evidence, not Intel hardware
  feature presence.
- Intel mechanisms may support isolation, translation, and control-flow enforcement
  but do not define MFOS semantics.
prohibited_inference:
- Intel features provide compatibility with any external operating system.
- Intel feature availability alone satisfies MFOS authorization, audit, or system-integrity
  requirements.
- Do not treat this card as a substitute for the Intel manuals.
