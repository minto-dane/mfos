  mapping_notes:
  - Use Linux documentation only as informative behavior context for pkey limitations.
  - Treat PKU as an optional compartment enforcement aid, not a system-integrity root.
mfos_divergence:
- MFOS may use PKU for compartments but must not use it as the primary system-integrity
  root or instruction-fetch protection.
- MFOS profile policy must specify behavior when PKU is absent, disabled, or insufficient.
prohibited_inference:
- PKU provides storage-key compatibility.
- PKU protects instruction fetch on x86_64.
- Linux pkey behavior defines MFOS normative behavior.
