mfos_divergence:
- PXM Guard is High-Assurance-only and protects selected MFOS root objects; it is
  not Windows VBS compatibility.
- MFOS does not import Windows policy semantics or deployment requirements.
prohibited_inference:
- MFOS implements Windows VBS.
- Guard is required for Baseline.
- Microsoft VBS behavior defines MFOS policy.
