mfos_divergence:
- MFOS Guard uses the concept only for selected root objects and does not implement
  Windows VTL semantics.
- MFOS device, DMA, and boot assumptions require independent profile-specific evidence.
prohibited_inference:
- MFOS implements VTLs.
- PXM Guard is VSM-compatible.
- VSM documentation defines MFOS dataset, authorization, or audit policy.
