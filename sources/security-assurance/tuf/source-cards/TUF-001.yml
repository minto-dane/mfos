mfos_divergence:
- MFOS uvsd uses a TUF-like model with MFOS component types, security epochs, activation
  profile constraints, audit, and recovery rollback workflow.
- MFOS must not claim TUF conformance unless a conformance analysis is performed separately.
prohibited_inference:
- A signature alone is sufficient update security.
- MFOS is TUF-compatible or TUF-conformant.
- Do not treat this card as a substitute for the TUF specification.
