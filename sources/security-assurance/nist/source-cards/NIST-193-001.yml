mfos_divergence:
- MFOS uses this as a resilience model for firmware, boot, update, and recovery planning,
  not as a firmware implementation.
- MFOS cannot assume control over all platform firmware without platform-specific
  evidence.
prohibited_inference:
- MFOS controls all platform firmware.
- Referencing NIST creates certification or conformance.
- Do not treat this card as a substitute for the NIST publication.
