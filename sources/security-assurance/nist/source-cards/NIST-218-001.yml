mfos_divergence:
- MFOS adds source IDs, negative tests, no-fake-success checks, and enterprise OS
  evidence discipline.
- SSDF alignment does not by itself prove MFOS system integrity or release readiness.
prohibited_inference:
- SSDF compliance alone proves MFOS system integrity.
- Referencing NIST creates certification or conformance.
- Do not treat this card as a substitute for the NIST publication.
