  mapping_notes:
  - Ground TPM-based firmware measurement and event-log evidence expectations.
  - Keep MFOS runtime integrity and authorization policy separate from measured boot
    evidence.
mfos_divergence:
- MFOS uses these mechanisms as boot and attestation evidence, not as a substitute
  for securityd policy or auditd records.
- Measured boot evidence must be bound to MFOS-specific component inventory and verification
  rules.
prohibited_inference:
- Measured boot alone proves MFOS runtime integrity.
- TPM evidence alone authorizes a workload or dataset action.
- Do not treat this card as a substitute for the TCG specification.
