log_kind: source_retrieval_log
schema_version: 1
status: public_safe_workbench
authority_status: preparatory_until_adr_migration
canonical_current:
  source_matrix_index: docs/design/source-matrix/source-matrix.yml
  source_matrix_cards: docs/design/source-matrix/cards
policy:
  purpose:
    - Track source retrieval activity without committing external source
      documents.
    - Preserve enough metadata to reproduce source discovery and review.
    - Keep docs/design/source-matrix canonical until ADR migration.
  committed_content_allowed:
    - source_id
    - public_url
    - landing_page_url
    - document_title
    - vendor_or_publisher
    - product_or_publication
    - version_or_section_scope
    - retrieved_at
    - retrieved_by
    - cache_manifest_path
    - checksum
    - review_disposition
    - purge_status
    - notes_public_safe
  committed_content_prohibited:
    - external_pdf
    - html_mirror
    - epub
    - screenshot
    - copied_excerpt
    - copied_table
    - copied_diagram
    - copied_record_layout
    - copied_command_syntax
    - copied_macro_signature
    - copied_message_catalog
    - detailed_source_substitute_summary
  cache_rules:
    cache_directory: sources/_cache
    cache_git_status: ignored
    manifests_only_in_git: false
    local_cache_may_include_temporary_downloads: true
    local_cache_must_not_be_authority: true
    purge_when_review_complete: true
  ibm_public_sources:
    - Use public IBM URLs or landing pages as citation authority.
    - Record document identity, retrieval date, version or section scope, and
      review disposition.
    - Do not commit IBM PDFs, HTML mirrors, screenshots, copied examples,
      copied tables, copied diagrams, command syntax, macro signatures, message
      catalogs, or record layouts.
    - Do not imply MFOS compatibility, certification, conformance, affiliation,
      support, or source substitution.
