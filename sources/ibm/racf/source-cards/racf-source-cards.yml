  vendor: IBM
  product_family: IBM z/OS
  document_title: z/OS Security Server RACF library
  current_official_urls:
  - https://www.ibm.com/docs/en/zos/3.2.0?topic=zos-security-server-racf
  version_or_scope: z/OS 3.2.0 library page
  pin_quality: release_and_topic_pinned_from_url
  review_topics:
  - central security manager
  - resource profiles
  - security administration
  - auditing interfaces
  - callable and macro interface bibliography
  mfos_mapping:
    components:
    - securityd
    - security profile administration
    - policy transactions
    requirements:
    - MFOS-REQ-AUTH-0001
    - MFOS-REQ-AUTH-0002
    - MFOS-REQ-AUTH-0003
    - MFOS-REQ-AUTH-0008
    notes:
    - Grounds the central-security-manager role and profile-centered administration
      model.
    - Library page is used as bibliography only; no command, macro, or data-area content
      is stored.
  divergence:
  - securityd has MFOS-native profiles, typed decisions, obligations, transactions,
    and policy-version binding.
  - securityd is RACF-inspired but not RACF-compatible.
  prohibited_inference:
  - securityd is RACF-compatible.
  - MFOS implements RACF commands, macros, databases, or messages.
  - IBM interface syntax may be copied.
  requirements:
  - Define securityd profile language, administrative operations, transaction semantics,
    and audit obligations.
  negative_tests:
  - TEST-SEC-BYPASS-DENY-001
  - TEST-SEC-POLICY-ROLLBACK-AUDIT-001
  status: draft
- card_id: SRC-CARD-IBM-RACF-RESOURCE-AUTHORIZATION-0001
  source_id: EXTREF-IBM-ZOS-RACF-RESOURCE-AUTHORIZATION-0001
  canonical_card: docs/design/source-matrix/cards/EXTREF-IBM-ZOS-RACF-RESOURCE-AUTHORIZATION-0001.yml
  vendor: IBM
  product_family: IBM z/OS
  document_title: Authorizing users to access protected resources
  current_official_urls:
  - https://www.ibm.com/docs/en/zos/3.2.0?topic=racf-authorizing-users-access-protected-resources
  version_or_scope: z/OS 3.2.0 topic
  pin_quality: release_and_topic_pinned_from_url
  review_topics:
  - principal
  - group
  - protected resource
  - resource profile
  - access list
  - default access
  mfos_mapping:
    components:
    - SecurityProfile
    - SecurityDecision
    - resource access control
    requirements:
    - MFOS-REQ-AUTH-0002
    - MFOS-REQ-AUTH-0004
    - MFOS-REQ-AUTH-0005
    - MFOS-REQ-AUTH-0006
    - MFOS-REQ-AUTH-0009
    notes:
    - Grounds users, groups, protected resources, profiles, explicit access entries,
      and default access as review topics.
    - Supports MFOS decisions that bind subject, resource, operation, policy version,
      and obligations.
  divergence:
  - MFOS adds decision obligations such as audit, MFA, dual control, break-glass,
    Guard approval, operator confirmation, unsupported, and spec-gap outcomes.
  - MFOS access authorities are native and must not copy RACF taxonomies by default.
  prohibited_inference:
  - MFOS resource profiles are RACF profiles.
  - MFOS supports RACF profile syntax or command behavior.
  - IBM default access semantics are MFOS semantics.
  requirements:
  - Define access-authority taxonomy for DATASET, SPOOL, JOB, PROGRAM, OPERATOR_COMMAND,
    PARTITION, and UPDATE_ARTIFACT.
  - Every DENY decision must be auditable with reason code and policy version.
  negative_tests:
  - TEST-DATA-DENY-001
  - TEST-DATA-STALE-HANDLE-001
  - TEST-OPER-COMMAND-DENY-001
  status: draft
