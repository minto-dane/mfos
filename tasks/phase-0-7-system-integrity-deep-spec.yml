  must_cover:
  - Purpose
  - Non-Compatibility Statement
  - Source Matrix References
  - Authorized vs Unauthorized
  - Execution States
  - Storage Domains
  - Protected Resources
  - System Interfaces
  - Prohibited Circumventions
  - SVC Rules
  - PCALL Rules
  - AMF Rules
  - securityd Authority
  - auditd Authority
  - Dataset/Catalog/Spool Rules
  - Operator Command Rules
  - Partition-Aware Requirements
  - High-Assurance Guard Extensions
  - Failure Modes
  - Formal Invariants
  - Positive Tests
  - Negative Tests
  - Spec Gaps
- task_id: P07-REQ-001
  title: Expand priority requirements registry for system integrity
  status: complete_for_initial_system_integrity_set
  outputs:
  - docs/design/registries/requirements.yaml
  - requirements/catalog.yml
  constraints:
  - Do not invent source refs.
  - Every security-sensitive requirement must include audit and negative tests.
- task_id: P07-TEST-001
  title: Register negative tests for system integrity and adjacent boundaries
  status: complete_for_draft_registry
  outputs:
  - docs/design/registries/tests.yaml
  required_areas:
  - unauthorized SVC
  - unauthorized PCALL
  - dataset handle bypass
  - catalog uncommitted resolve
  - audit unavailable
  - operator destructive command
  - AMF-disabled load
  - PXM semantic misuse
  - Guard scope refusal
- task_id: P07-EVID-001
  title: Separate planned evidence from verified evidence
  status: complete_for_draft_registry
  outputs:
  - docs/design/registries/evidence.yaml
  - evidence/traceability/gap-report.yml
  constraints:
  - Draft evidence IDs must not be treated as proof.
  - Release-mode lint must reject verified-claim language without verified evidence.
- task_id: P07-SRC-001
  title: Tighten source-card section and version pins
  status: partial
  outputs:
  - docs/design/source-matrix/cards/*.yml
  - reports/source-card-audit.md
  constraints:
  - Do not copy IBM document text into the repository.
  - Do not invent publication numbers or section names.
- task_id: P07-JA-001
  title: Advance Japanese mirror mechanics without changing canonical semantics
  status: partial
  outputs:
  - docs/design/ja/translation-units.yaml
  - docs/design/ja/sync-status.yaml
  constraints:
  - English remains canonical.
  - Japanese mirror status may remain incomplete if sync metadata is explicit.
